<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Admin — ShopZiCiCRBLX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0d0e11;color:#f5f5f5}
.wrap{max-width:1000px;margin:auto;padding:24px 14px}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#15161a;border:1px solid #292b31;border-radius:16px;margin-bottom:14px}.logo{font-weight:800;font-size:20px}.back{color:#fff;text-decoration:none;font-weight:700}
.chat{height:calc(100vh - 150px);min-height:520px;background:#15161a;border:1px solid #292b31;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.head{padding:15px 18px;border-bottom:1px solid #292b31;display:flex;align-items:center;gap:12px}.status{font-size:13px;color:#aaa}.messages{flex:1;overflow:auto;padding:18px;background:#101114}.msg{max-width:78%;margin:9px 0;padding:11px 14px;border-radius:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.me{margin-left:auto;background:#fff;color:#111;border-bottom-right-radius:5px}.admin{margin-right:auto;background:#292b31;color:#fff;border-bottom-left-radius:5px}.meta{font-size:11px;opacity:.6;margin-top:5px}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid #292b31}.composer textarea{flex:1;height:52px;resize:none;border:1px solid #363941;background:#0f1013;color:#fff;border-radius:12px;padding:12px;font:inherit}.composer button{border:0;border-radius:12px;padding:0 22px;background:#fff;color:#111;font-weight:800}.notice{text-align:center;color:#999;padding:45px 20px}.error{color:#ff8f8f}.retry{margin-top:12px;padding:9px 14px;border:1px solid #444;border-radius:10px;background:#1b1c21;color:#fff}
.st{margin-top:3px;font-size:11px;font-weight:700;text-align:right}.st-pend{color:#9ca3af}.st-sent{color:#6b7280}.st-recv{color:#4b5563}.st-seen{color:#2563eb}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="logo">ShopZiCiCRBLX · Chat Admin</div><a class="back" href="./" title="Về shop">← Về shop</a></div>
<div class="chat">
<div class="head"><strong id="title">Chat với Admin</strong><span id="status" class="status">Đang kết nối...</span></div>
<div id="messages" class="messages"><div class="notice">Đang kết nối hệ thống chat...</div></div>
<div class="composer"><textarea id="input" maxlength="2000" placeholder="Nhập tin nhắn cho Admin..." disabled></textarea><button id="send" disabled>Gửi</button></div>
</div></div>
<script>
const URL='https://ufevipuhejvhiufyqqnz.supabase.co';
const KEY='sb_publishable_6ShPhvGpN4_02Za2tOTOTg_GF0su_OA';
let token=localStorage.getItem('shopzicl_username_token'),user=null,busy=false,timer=null,sending=false,statusOn=true,pending=[],lastRows=[],lastSig="",seenBusy=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeoutFetch(url,opt={},ms=8000){return Promise.race([fetch(url,opt),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Kết nối quá lâu. Vui lòng thử lại.')),ms))]);}
async function jsonFetch(path,opt={}){const r=await timeoutFetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});const txt=await r.text();let d={};try{d=txt?JSON.parse(txt):{}}catch{}if(!r.ok)throw new Error(d.message||d.error_description||d.error||txt||('HTTP '+r.status));return d;}
function showError(msg){$('status').textContent='Lỗi kết nối';$('messages').innerHTML='<div class="notice error">❌ '+esc(msg)+'<br><button class="retry" onclick="start()">Thử lại</button></div>';$('send').disabled=true;$('input').disabled=true;}
function stHtml(x){if(x.__pending)return '<div class="st st-pend">Đang gửi…</div>';if(!statusOn)return '<div class="st st-sent">✓ Đã gửi</div>';if(x.read_at)return '<div class="st st-seen">✓✓ Đã xem</div>';if(x.delivered_at)return '<div class="st st-recv">✓✓ Đã nhận</div>';return '<div class="st st-sent">✓ Đã gửi</div>'}
function render(rows){const all=rows.concat(pending);if(!all.length){$('messages').innerHTML='<div class="notice">Chưa có tin nhắn.<br>Hãy gửi tin nhắn đầu tiên cho Admin.</div>';return}$('messages').innerHTML=all.map(x=>{const mine=x.sender_role==='customer';return '<div class="msg '+(mine?'me':'admin')+'"><div>'+esc(x.message)+'</div><div class="meta">'+(mine?'Bạn':'Admin')+' · '+new Date(x.created_at).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})+'</div>'+(mine?stHtml(x):'')+'</div>'}).join('');$('messages').scrollTop=$('messages').scrollHeight}
async function fetchRows(){const b='/rest/v1/shop_chat_messages?select=id,user_id,sender_role,message,created_at';const f='&user_id=eq.'+encodeURIComponent(user.id)+'&order=created_at.asc';try{return await jsonFetch(b+(statusOn?',delivered_at,read_at':'')+f)}catch(e){if(statusOn&&/delivered_at|read_at|column|42703/i.test(String(e.message))){statusOn=false;return await jsonFetch(b+f)}throw e}}
async function seenRpc(read){if(seenBusy||!user)return;seenBusy=true;try{await jsonFetch('/rest/v1/rpc/chat_mark_seen',{method:'POST',body:JSON.stringify({p_user_id:user.id,p_read:read})})}catch(e){console.warn(e)}finally{seenBusy=false}}
function markIncoming(rows){if(!statusOn)return;const inc=rows.filter(x=>x.sender_role!=='customer');const unread=inc.some(x=>!x.read_at);const undelivered=inc.some(x=>!x.delivered_at);const visible=document.visibilityState==='visible';if(unread&&visible)seenRpc(true);else if(undelivered)seenRpc(false)}
async function loadMessages(){if(!user)return;const rows=await fetchRows();markIncoming(rows);const sig=JSON.stringify(rows);if(sig===lastSig)return;lastSig=sig;lastRows=rows;render(rows)}
async function start(){if(busy)return;busy=true;clearInterval(timer);$('send').disabled=true;$('input').disabled=true;$('status').textContent='Đang kiểm tra đăng nhập...';$('messages').innerHTML='<div class="notice">Đang kết nối hệ thống chat...</div>';try{if(!token)throw new Error('Bạn chưa đăng nhập. Hãy đăng nhập trên shop rồi mở Chat Admin.');const r=await timeoutFetch(URL+'/functions/v1/username-auth',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'me'})});const d=await r.json();if(!r.ok||!d.ok||!d.user)throw new Error(d.error||'Phiên đăng nhập hết hạn. Hãy đăng nhập lại.');user=d.user;if(user.role==='admin'||user.role==='manager'){$('title').textContent='Chat khách hàng';$('status').textContent='Tài khoản quản trị';}await loadMessages();$('status').textContent='Đã kết nối';$('send').disabled=false;$('input').disabled=false;timer=setInterval(async()=>{try{await loadMessages()}catch(e){console.warn(e)}},3000)}catch(e){showError(e.message||'Không kết nối được chat.')}finally{busy=false}}
async function send(){if(sending)return;const text=$('input').value.trim();if(!text||!user)return;sending=true;$('send').disabled=true;$('input').value='';const p={sender_role:'customer',message:text,created_at:new Date().toISOString(),__pending:true};pending.push(p);render(lastRows);try{await jsonFetch('/rest/v1/shop_chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:user.id,sender_role:'customer',message:text})})}catch(e){pending=pending.filter(x=>x!==p);render(lastRows);if(!$('input').value)$('input').value=text;alert('Không gửi được tin nhắn: '+e.message);sending=false;$('send').disabled=false;return}pending=pending.filter(x=>x!==p);lastSig='';try{await loadMessages()}catch(e){console.warn(e);render(lastRows)}sending=false;$('send').disabled=false;$('input').focus()}
$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!e.repeat)send()}});
document.addEventListener('visibilitychange',()=>{if(user&&document.visibilityState==='visible')loadMessages().catch(e=>console.warn(e))});
window.addEventListener('focus',()=>{if(user)loadMessages().catch(e=>console.warn(e))});
start();
</script></body></html>
