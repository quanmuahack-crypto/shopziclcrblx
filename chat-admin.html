<style>
:root{--bg:#07050c;--bg2:#0d0915;--panel:#120d1c;--panel2:#181126;--line:#2a1f40;--line2:#3b2b5c;--cyan:#8b5cf6;--cyan-2:#c4b5fd;--gold:#e9c46a;--gold2:#f7e2a8;--text:#f3eefc;--muted:#a99ec4;--in:#1c1530;--in-line:#2f2347;--ok:#4ade80;--display:'Chakra Petch','Be Vietnam Pro',system-ui,sans-serif;--body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
html[data-theme="light"]{--bg:#f7f5fb;--bg2:#f2eef9;--panel:#ffffff;--panel2:#faf8fd;--line:#ebe6f3;--line2:#ddd5ea;--cyan:#7c3aed;--cyan-2:#6d28d9;--gold:#b7862b;--gold2:#8a6116;--text:#0f172a;--muted:#64748b;--in:#ffffff;--in-line:#e9e3f3;--ok:#16a34a}
*{box-sizing:border-box}
html{color-scheme:dark;height:100%}
html[data-theme="light"]{color-scheme:light}
body{margin:0;height:100%;font-family:var(--body);color:var(--text);background-color:var(--bg);background-image:repeating-linear-gradient(135deg,rgba(139,92,246,.07) 0 2px,transparent 2px 24px),radial-gradient(70% 50% at 50% -10%,rgba(124,58,237,.32),transparent 70%);background-attachment:fixed}

.head{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(124,58,237,.18),transparent 70%)}

.bub{position:relative;max-width:min(560px,74%);padding:11px 15px 9px;border-radius:20px;line-height:1.55;font-size:14.8px;white-space:pre-wrap;word-break:break-word;animation:pop .22s ease-out}

.row.me .bub{color:#fff;background:linear-gradient(135deg,#7c3aed,#9d5cf7 60%,#b07af9);border-bottom-right-radius:6px;box-shadow:0 10px 24px -14px rgba(124,58,237,.9)}

.row.ad .meta{justify-content:flex-start}
.tick{display:inline-flex;align-items:center;gap:2px;font-weight:700}
.tick svg{width:14px;height:14px;stroke-width:2.6}

.row.pend .bub{opacity:.65}

.notice .big svg{width:38px;height:38px;stroke-width:1.6}
.notice b{color:var(--text);font-size:18px;font-family:var(--display);letter-spacing:.4px}
.notice.err b{color:#f87171}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;margin-top:14px;padding:0 20px;border-radius:12px;border:0;background:var(--cyan);color:#fff;font-weight:700;text-decoration:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--gold);animation:rot .8s linear infinite;margin-bottom:10px}

.newpill.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.newpill svg{width:15px;height:15px;stroke-width:2.6}
.foot{position:relative;z-index:2;padding:10px 16px 16px;border-top:1px solid var(--line);background:linear-gradient(0deg,var(--panel2),transparent)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:13px;font-weight:600}
.quick button:hover{border-color:var(--gold);color:var(--gold2)}
html[data-theme="light"] .quick button:hover{color:var(--gold)}
.box{display:flex;align-items:flex-end;gap:10px;padding:6px 6px 6px 16px;border-radius:18px;background:var(--bg);border:1px solid var(--line2);transition:border-color .15s,box-shadow .15s}
html[data-theme="light"] .box{background:#fff}
.box:focus-within{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.box textarea{flex:1;min-width:0;height:24px;max-height:140px;margin:10px 0;padding:0;resize:none;border:0;outline:0;background:none;font-size:15px;line-height:24px}
.box textarea::placeholder{color:var(--muted)}
.cnt{align-self:center;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s}
.cnt.show{opacity:1}
.send{width:46px;height:46px;flex:none;border-radius:14px;border:0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 8px 20px -10px #8b5cf6;transition:transform .12s,opacity .15s}
.send:not(:disabled):hover{transform:translateY(-1px)}
.send:disabled{opacity:.4;cursor:default}
.hint{margin:8px 4px 0;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:10px}
.hint kbd{font-family:inherit;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);font-size:11px}
@media(max-width:720px){.app{padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:10px}.logo b,.hk{display:none}.chat{border-radius:20px}.chat:before{border-radius:20px}.head{padding:13px 14px}.av{width:44px;height:44px}.msgs{padding:16px 12px 8px}.bub{max-width:84%;font-size:14.5px}.row .mini{display:none}.hint .k{display:none}.foot{padding:8px 10px 10px}}
@media(prefers-reduced-motion:reduce){.bub{animation:none}.msgs{scroll-behavior:auto}}

<script>
const URL='https://ufevipuhejvhiufyqqnz.supabase.co';
const KEY='sb_publishable_6ShPhvGpN4_02Za2tOTOTg_GF0su_OA';
let token=(()=>{try{return localStorage.getItem('shopzicl_username_token')}catch(e){return null}})(),user=null,busy=false,timer=null,sending=false,statusOn=true,pending=[],lastRows=[],lastSig="",seenBusy=false,lastCount=0;
const $=id=>document.getElementById(id);
const IC={check:'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',dbl:'<svg viewBox="0 0 24 24" style="width:18px"><path d="M2 12l5 5L18 6"/><path d="M12 16l1 1L24 6"/></svg>',clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>',lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',retry:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,u=>'<a href="'+u+'" target="_blank" rel="noopener noreferrer" title="'+u+'">'+u+'</a>')}
function thPaint(){$('thBtn').innerHTML=document.documentElement.getAttribute('data-theme')==='light'?IC.sun:IC.moon}
$('thBtn').onclick=()=>{const l=document.documentElement.getAttribute('data-theme')!=='light';if(l)document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('shop_theme',l?'light':'dark')}catch(e){}thPaint()};
thPaint();
function timeoutFetch(url,opt={},ms=8000){return Promise.race([fetch(url,opt),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Kết nối quá lâu. Vui lòng thử lại.')),ms))]);}
async function jsonFetch(path,opt={}){const r=await timeoutFetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});const txt=await r.text();let d={};try{d=txt?JSON.parse(txt):{}}catch{}if(!r.ok)throw new Error(d.message||d.error_description||d.error||txt||('HTTP '+r.status));return d;}
function setStatus(t,err){const s=$('status');s.textContent=t;s.classList.toggle('err',!!err)}
function showError(msg){setStatus('Mất kết nối',true);$('av').classList.remove('on');const login=!token||/đăng nhập/i.test(msg);$('messages').innerHTML='<div class="notice err"><div class="big">'+(login?IC.lock:IC.retry)+'</div><b>'+(login?'Cần đăng nhập':'Không kết nối được')+'</b><span>'+esc(msg)+'</span>'+(login?'<a class="btn" href="./" title="Đăng nhập tại shop">Đăng nhập tại shop</a>':'<button class="btn" type="button" onclick="start()">'+IC.retry+'Thử lại</button>')+'</div>';$('send').disabled=true;$('input').disabled=true;}
function stHtml(x){if(x.__pending)return '<span class="tick">'+IC.clock+'Đang gửi</span>';if(!statusOn)return '<span class="tick">'+IC.check+'Đã gửi</span>';if(x.read_at)return '<span class="tick seen">'+IC.dbl+'Đã xem</span>';if(x.delivered_at)return '<span class="tick">'+IC.dbl+'Đã nhận</span>';return '<span class="tick">'+IC.check+'Đã gửi</span>'}
function dayLabel(d){const x=new Date(d),t=new Date();const a=new Date(x.getFullYear(),x.getMonth(),x.getDate()),b=new Date(t.getFullYear(),t.getMonth(),t.getDate());const n=Math.round((b-a)/864e5);if(n===0)return 'Hôm nay';if(n===1)return 'Hôm qua';return x.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function nearBottom(){const m=$('messages');return m.scrollHeight-m.scrollTop-m.clientHeight<120}
function toBottom(smooth){const m=$('messages');m.style.scrollBehavior=smooth?'smooth':'auto';m.scrollTop=m.scrollHeight;$('newPill').classList.remove('show')}
function render(rows,forceBottom){const all=rows.concat(pending);const m=$('messages');if(!all.length){m.innerHTML='<div class="notice"><div class="big">'+IC.chat+'</div><b>Xin chào'+(user&&user.username?' '+esc(user.username):'')+'!</b><span>Admin luôn sẵn sàng hỗ trợ bạn về đơn hàng, nạp thẻ và dịch vụ.<br>Gửi tin nhắn đầu tiên hoặc chọn một câu hỏi nhanh bên dưới.</span></div>';lastCount=0;return}
 const stick=forceBottom||nearBottom();let out='',lastDay='',prev=null;
 all.forEach((x,i)=>{const mine=x.sender_role==='customer';const d=dayLabel(x.created_at);if(d!==lastDay){out+='<div class="day">'+esc(d)+'</div>';lastDay=d;prev=null}const next=all[i+1];const nextSame=next&&(next.sender_role==='customer')===mine&&dayLabel(next.created_at)===d;const cont=prev&&(prev.sender_role==='customer')===mine;const time=new Date(x.created_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  out+='<div class="row '+(mine?'me':'ad')+(cont?' cont':'')+(x.__pending?' pend':'')+'">'+(mine?'':'<span class="mini'+(nextSame?' hide':'')+'">ZC</span>')+'<div class="bub">'+linkify(x.message)+'<div class="meta">'+(mine?'':'<span>Admin</span>·')+'<span>'+time+'</span>'+(mine?stHtml(x):'')+'</div></div></div>';prev=x});
 const grew=all.length>lastCount;lastCount=all.length;m.innerHTML=out;if(stick)toBottom(false);else if(grew)$('newPill').classList.add('show')}
async function fetchRows(){const b='/rest/v1/shop_chat_messages?select=id,user_id,sender_role,message,created_at';const f='&user_id=eq.'+encodeURIComponent(user.id)+'&order=created_at.asc';try{return await jsonFetch(b+(statusOn?',delivered_at,read_at':'')+f)}catch(e){if(statusOn&&/delivered_at|read_at|column|42703/i.test(String(e.message))){statusOn=false;return await jsonFetch(b+f)}throw e}}
async function seenRpc(read){if(seenBusy||!user)return;seenBusy=true;try{await jsonFetch('/rest/v1/rpc/chat_mark_seen',{method:'POST',body:JSON.stringify({p_user_id:user.id,p_read:read})})}catch(e){console.warn(e)}finally{seenBusy=false}}
function markIncoming(rows){if(!statusOn)return;const inc=rows.filter(x=>x.sender_role!=='customer');const unread=inc.some(x=>!x.read_at);const undelivered=inc.some(x=>!x.delivered_at);const visible=document.visibilityState==='visible';if(unread&&visible)seenRpc(true);else if(undelivered)seenRpc(false)}
async function loadMessages(force){if(!user)return;const rows=await fetchRows();markIncoming(rows);const sig=JSON.stringify(rows);if(sig===lastSig&&!force)return;lastSig=sig;lastRows=rows;render(rows,force)}
function online(){setStatus('Đang hoạt động · thường trả lời trong vài phút');$('av').classList.add('on')}
async function start(){if(busy)return;busy=true;clearInterval(timer);$('send').disabled=true;$('input').disabled=true;setStatus('Đang kiểm tra đăng nhập...');$('messages').innerHTML='<div class="notice"><div class="spin"></div>Đang kết nối hệ thống chat...</div>';try{if(!token)throw new Error('Bạn chưa đăng nhập. Hãy đăng nhập trên shop rồi mở Chat Admin.');const r=await timeoutFetch(URL+'/functions/v1/username-auth',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'me'})});const d=await r.json();if(!r.ok||!d.ok||!d.user)throw new Error(d.error||'Phiên đăng nhập hết hạn. Hãy đăng nhập lại.');user=d.user;lastSig='';await loadMessages(true);if(user.role==='admin'||user.role==='manager'){$('title').textContent='Chat khách hàng';setStatus('Tài khoản quản trị');$('av').classList.add('on')}else online();$('input').disabled=false;syncBtn();timer=setInterval(async()=>{try{await loadMessages()}catch(e){console.warn(e)}},3000)}catch(e){showError(e.message||'Không kết nối được chat.')}finally{busy=false}}
function grow(){const t=$('input');t.style.height='24px';t.style.height=Math.min(t.scrollHeight,140)+'px'}
function syncBtn(){const v=$('input').value;$('send').disabled=sending||!user||!v.trim();const c=$('cnt');c.textContent=v.length+'/2000';c.classList.toggle('show',v.length>1500)}
async function send(){if(sending)return;const text=$('input').value.trim();if(!text||!user)return;sending=true;$('input').value='';grow();syncBtn();const p={sender_role:'customer',message:text,created_at:new Date().toISOString(),__pending:true};pending.push(p);render(lastRows,true);try{await jsonFetch('/rest/v1/shop_chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:user.id,sender_role:'customer',message:text})})}catch(e){pending=pending.filter(x=>x!==p);render(lastRows,true);if(!$('input').value){$('input').value=text;grow()}alert('Không gửi được tin nhắn: '+e.message);sending=false;syncBtn();return}pending=pending.filter(x=>x!==p);lastSig='';try{await loadMessages(true)}catch(e){console.warn(e);render(lastRows,true)}sending=false;syncBtn();$('input').focus()}
$('send').onclick=send;
$('input').addEventListener('input',()=>{grow();syncBtn()});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!e.repeat)send()}});
$('quick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||$('input').disabled)return;$('input').value=b.textContent;grow();syncBtn();$('input').focus()});
$('newPill').onclick=()=>toBottom(true);
$('messages').addEventListener('scroll',()=>{if(nearBottom())$('newPill').classList.remove('show')});
document.addEventListener('visibilitychange',()=>{if(user&&document.visibilityState==='visible')loadMessages().catch(e=>console.warn(e))});
window.addEventListener('focus',()=>{if(user)loadMessages().catch(e=>console.warn(e))});
start();
</script>
</body>
</html>
