<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Admin — ShopZiCiCRBLX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#171717}
.wrap{max-width:900px;margin:0 auto;padding:24px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 24px #0000000a}
.logo{font-weight:800}.back{color:#111;text-decoration:none;font-weight:700}
.chat{height:70vh;min-height:500px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 35px #0000000c}
.bar{padding:14px 16px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center}
select{padding:9px 11px;border:1px solid #ddd;border-radius:10px;background:#fff}
.messages{flex:1;overflow:auto;padding:18px;background:#fafafa}
.msg{max-width:78%;margin:8px 0;padding:10px 13px;border-radius:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.me{margin-left:auto;background:#111;color:#fff;border-bottom-right-radius:5px}
.admin{margin-right:auto;background:#eee;color:#111;border-bottom-left-radius:5px}
.meta{font-size:11px;opacity:.65;margin-top:4px}
.composer{display:flex;gap:9px;padding:12px;border-top:1px solid #eee;background:#fff}
textarea{flex:1;resize:none;height:48px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit}
button{border:0;border-radius:12px;padding:0 18px;background:#111;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.notice{text-align:center;padding:30px;color:#666}
#status{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">ShopZiCiCRBLX · Chat Admin</div>
    <a class="back" href="./">← Về shop</a>
  </div>
  <div class="chat">
    <div class="bar">
      <strong id="title">Chat với Admin</strong>
      <select id="conversation" style="display:none"></select>
      <span id="status">Đang kết nối...</span>
    </div>
    <div id="messages" class="messages"><div class="notice">Đang tải tin nhắn...</div></div>
    <div class="composer">
      <textarea id="input" maxlength="2000" placeholder="Nhập tin nhắn..."></textarea>
      <button id="send">Gửi</button>
    </div>
  </div>
</div>
<script>
const URL='https://ufevipuhejvhiufyqqnz.supabase.co';
const KEY='sb_publishable_6ShPhvGpN4_02Za2tOTOTg_GF0su_OA';
const token=localStorage.getItem('shopzicl_username_token');
const sb=supabase.createClient(URL,KEY,{global:{headers:token?{Authorization:'Bearer '+token}:{}}});
let me=null,isAdmin=false,currentUserId=null,channel=null,profiles={};

const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function time(s){return new Date(s).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});}
function render(rows){
  const box=$('messages');
  if(!rows.length){box.innerHTML='<div class="notice">Chưa có tin nhắn. Hãy gửi tin nhắn cho Admin.</div>';return;}
  box.innerHTML=rows.map(x=>{
    const mine=x.sender_role==='customer' && x.user_id===currentUserId;
    return '<div class="msg '+(mine?'me':'admin')+'"><div>'+esc(x.message)+'</div><div class="meta">'+(mine?'Bạn':'Admin')+' · '+time(x.created_at)+'</div></div>';
  }).join('');
  box.scrollTop=box.scrollHeight;
}
async function loadMessages(){
  if(!currentUserId){$('messages').innerHTML='<div class="notice">Chưa xác định được tài khoản.</div>';return;}
  let q=sb.from('shop_chat_messages').select('id,user_id,sender_role,message,created_at').order('created_at',{ascending:true});
  if(!isAdmin) q=q.eq('user_id',currentUserId);
  else if(currentUserId) q=q.eq('user_id',currentUserId);
  const {data,error}=await q;
  if(error){$('messages').innerHTML='<div class="notice">Không tải được tin nhắn: '+esc(error.message)+'</div>';return;}
  render(data||[]);
}
async function loadConversations(){
  const {data:rows,error}=await sb.from('shop_chat_messages').select('user_id').order('created_at',{ascending:false});
  if(error)return;
  const ids=[...new Set((rows||[]).map(x=>x.user_id))];
  if(!ids.length){$('status').textContent='Chưa có cuộc trò chuyện';return;}
  const p=await sb.from('profiles').select('id,username').in('id',ids);
  (p.data||[]).forEach(x=>profiles[x.id]=x.username);
  const sel=$('conversation');
  sel.innerHTML=ids.map(id=>'<option value="'+esc(id)+'">'+esc(profiles[id]||id)+'</option>').join('');
  sel.style.display='block';
  currentUserId=ids[0];
  sel.value=currentUserId;
  await loadMessages();
}
async function start(){
  $('send').disabled=true;
  $('messages').innerHTML='<div class="notice">Đang xác thực tài khoản...</div>';
  if(!token){$('status').textContent='Chưa đăng nhập';$('messages').innerHTML='<div class="notice">Bạn cần đăng nhập tài khoản shop trước khi chat với Admin.</div>';$('send').disabled=true;return;}
  try{
    const authRes=await fetch(URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});
    const authData=await authRes.json();
    if(!authRes.ok||!authData.id)throw new Error('Phiên đăng nhập hết hạn. Hãy đăng xuất rồi đăng nhập lại.');
    me=authData;
    const p=await sb.from('profiles').select('id,username,role').eq('id',me.id).maybeSingle();
    if(p.error)throw new Error('Không đọc được tài khoản: '+p.error.message);
    if(!p.data)throw new Error('Tài khoản chưa có hồ sơ trong hệ thống.');
    isAdmin=p.data.role==='admin'||p.data.role==='manager';
  }catch(e){
    $('status').textContent='Lỗi kết nối';
    $('messages').innerHTML='<div class="notice">'+esc(e.message)+'</div>';
    return;
  }
  currentUserId=me.id;
  $('title').textContent=isAdmin?'Quản lý Chat khách hàng':'Chat với Admin';
  $('status').textContent=isAdmin?'Admin · đang online':'Đang kết nối';
  try{
    if(isAdmin) await loadConversations(); else await loadMessages();
    $('send').disabled=false;
  }catch(e){
    $('status').textContent='Lỗi tải chat';
    $('messages').innerHTML='<div class="notice">Không tải được tin nhắn: '+esc(e.message)+'</div>';
  }

  channel=sb.channel('shop-chat-realtime')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'shop_chat_messages'},async payload=>{
      if(isAdmin){await loadConversations();}else if(payload.new.user_id===currentUserId){await loadMessages();}
    }).subscribe((s)=>{if(s==='SUBSCRIBED')$('status').textContent=isAdmin?'Admin · realtime':'Đang online';});
}
$('conversation').addEventListener('change',async e=>{currentUserId=e.target.value;await loadMessages();});
$('send').onclick=async()=>{
  const message=$('input').value.trim();if(!message||!me)return;
  $('send').disabled=true;
  const row={user_id:currentUserId,sender_role:isAdmin?'admin':'customer',message};
  const {error}=await sb.from('shop_chat_messages').insert(row);
  if(error)alert('Không gửi được: '+error.message);else $('input').value='';
  $('send').disabled=false;
};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click();}});
start();
</script>
</body>
</html>
