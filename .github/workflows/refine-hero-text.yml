name: Refine hero text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, 'fix: refine hero text') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine hero only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.hero{background:linear-gradient(135deg,#101827,#31569b);color:#fff;border-radius:22px;padding:28px 30px;margin:0 auto 25px;text-align:center;max-width:1250px;box-shadow:0 8px 25px #0001}.hero h1{font-size:clamp(36px,5vw,64px);margin:0 0 8px;font-weight:900;letter-spacing:-1px}.hero p{margin:0;font-size:clamp(18px,2.4vw,30px);font-weight:800;opacity:.95}'
          new_css = '.hero{background:#fff;color:#172033;border:1px solid #e5e9f0;border-radius:22px;padding:30px 24px 28px;margin:0 auto 25px;text-align:center;max-width:1250px;box-shadow:0 8px 25px #0001}.hero h1{font-size:clamp(42px,5.6vw,72px);line-height:1.05;margin:0 0 12px;font-weight:900;letter-spacing:-2px;text-transform:uppercase}.hero p{margin:0 auto;font-size:clamp(18px,2.2vw,30px);line-height:1.3;font-weight:800;color:#172033}.hero p:before,.hero p:after{content:"";display:inline-block;width:58px;height:4px;border-radius:99px;background:#2878ff;vertical-align:middle;margin:0 18px 5px}'
          s = s.replace(old_css, new_css)

          old_two = '<section class="hero"><h1>Cày thuê Blox Fruits</h1><p>Dịch vụ Gamepass, Trái ác quỷ và nhiều dịch vụ khác</p></section>'
          old_one = '<section class="hero"><h1>Cày thuê Blox Fruits, Gamepass, Trái ác quỷ vv,...</h1></section>'
          new_hero = '<section class="hero"><h1>Cày thuê Blox Fruits</h1><p>Dịch vụ Gamepass, Trái ác quỷ và nhiều dịch vụ khác</p></section>'
          s = s.replace(old_two, new_hero).replace(old_one, new_hero)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refined hero
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/refine-hero-text.yml
          git commit -m 'fix: refine hero text' || exit 0
          git rm .github/workflows/refine-hero-text.yml
          git add index.html
          git commit --amend --no-edit
          git push
