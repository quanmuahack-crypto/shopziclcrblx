name: Embed UGPhone services
on:
  push:
    paths-ignore:
      - 'index.html'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the UGPhone section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          section=r'''<section id="ugphone-services" class="section">
          <style>
          .ugphone-main-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
          .ugphone-choice{position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#fff,#f3f6ff);border:1px solid #dfe5f3;transition:transform .18s,box-shadow .18s}
          .ugphone-choice:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0002}
          .ugphone-choice h3{margin:10px 0 6px;font-size:24px}
          .ugphone-choice p{margin:0;color:#667085}
          .ugphone-packages{display:none;margin-top:14px;padding:16px;border:1px solid #e5e9f0;border-radius:14px;background:#fafbff}
          .ugphone-packages.show{display:block}
          .ugphone-package-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
          .ugphone-package{background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:13px}
          .ugphone-package strong{display:block;margin-bottom:5px}
          .ugphone-package button{margin-top:10px}
          @media(max-width:700px){.ugphone-main-grid,.ugphone-package-list{grid-template-columns:1fr}}
          </style>
          <h2>☁️ Dịch vụ UGPHONE</h2>
          <p>Chọn loại máy phù hợp nhu cầu treo Roblox.</p>
          <div class="ugphone-main-grid">
            <article class="card ugphone-choice">
              <div><div class="status">💎 GVIP</div><h3>UGPHONE GVIP</h3><p>Treo được 2–3 tab Roblox.</p></div>
              <button class="btn dark full" type="button" onclick="toggleUgPhonePackages('ug-gvip-packages')">XEM GÓI GVIP →</button>
            </article>
            <article class="card ugphone-choice">
              <div><div class="status">👑 SVIP</div><h3>UGPHONE SVIP</h3><p>Treo được 6 tab Roblox.</p></div>
              <button class="btn dark full" type="button" onclick="toggleUgPhonePackages('ug-svip-packages')">XEM GÓI SVIP →</button>
            </article>
          </div>
          <div id="ug-gvip-packages" class="ugphone-packages">
            <h3>💎 Các gói GVIP</h3><div class="ugphone-package-list">
              <div class="ugphone-package"><strong>GVIP 2 ngày</strong><span>30.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE GVIP','GVIP 2 ngày',30000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>GVIP 5 ngày</strong><span>35.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE GVIP','GVIP 5 ngày',35000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>GVIP 7 ngày</strong><span>40.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE GVIP','GVIP 7 ngày',40000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>GVIP 10 ngày</strong><span>55.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE GVIP','GVIP 10 ngày',55000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>GVIP 15 ngày</strong><span>75.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE GVIP','GVIP 15 ngày',75000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>GVIP 30 ngày</strong><span>150.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE GVIP','GVIP 30 ngày',150000)">MUA GÓI</button></div>
            </div><p class="empty">📝 GVIP treo được 2–3 tab Roblox.</p>
          </div>
          <div id="ug-svip-packages" class="ugphone-packages">
            <h3>👑 Các gói SVIP</h3><div class="ugphone-package-list">
              <div class="ugphone-package"><strong>SVIP 7 ngày</strong><span>100.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE SVIP','SVIP 7 ngày',100000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>SVIP 15 ngày</strong><span>160.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE SVIP','SVIP 15 ngày',160000)">MUA GÓI</button></div>
              <div class="ugphone-package"><strong>SVIP 30 ngày</strong><span>250.000 đ</span><button class="btn dark full" type="button" onclick="openUgPhoneOrder('UGPHONE SVIP','SVIP 30 ngày',250000)">MUA GÓI</button></div>
            </div><p class="empty">📝 SVIP treo được 6 tab Roblox.</p>
          </div>
          <script>
          function toggleUgPhonePackages(id){
            const target=document.getElementById(id);
            if(!target)return;
            document.querySelectorAll('.ugphone-packages').forEach(x=>{if(x!==target)x.classList.remove('show')});
            target.classList.toggle('show');
          }
          function openUgPhoneOrder(service,packageName,price){
            if(typeof currentUser==='undefined'||!currentUser){if(typeof openAuth==='function')openAuth();else alert('Vui lòng đăng nhập trước.');return}
            window.ugSelected={service,packageName,price};
            document.getElementById('ugOrderTitle').textContent='Đặt đơn — '+packageName;
            document.getElementById('ugOrderPrice').textContent=Number(price).toLocaleString('vi-VN')+' đ';
            document.getElementById('ugRobloxAccount').value='';
            document.getElementById('ugRobloxPassword').value='';
            document.getElementById('ugBackupCode').value='';
            document.getElementById('ugOrderMsg').innerHTML='';
            document.getElementById('ugOrderModal').classList.add('show');
          }
          function closeUgPhoneOrder(){document.getElementById('ugOrderModal').classList.remove('show')}
          async function submitUgPhoneOrder(){
            const msg=document.getElementById('ugOrderMsg');
            if(!window.ugSelected)return;
            const account=document.getElementById('ugRobloxAccount').value.trim();
            const password=document.getElementById('ugRobloxPassword').value;
            const backup=document.getElementById('ugBackupCode').value.trim();
            if(!account||!password||!backup){msg.innerHTML='<div class="msg danger">Vui lòng nhập ID, mật khẩu và mã dự phòng.</div>';return}
            try{
              if(typeof refreshBalance==='function')await refreshBalance();
              if(Number(currentUser.balance||0)<window.ugSelected.price){msg.innerHTML='<div class="msg danger">Số dư không đủ. Vui lòng nạp tiền và chờ Admin duyệt.</div>';return}
              await api('orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:currentUser.id,service_name:window.ugSelected.service,package_name:window.ugSelected.packageName,price:window.ugSelected.price,status:'pending',game_username:account,game_password:password,extra_data:'Mã dự phòng: '+backup})});
              if(typeof refreshBalance==='function')await refreshBalance();
              closeUgPhoneOrder();
              alert('✅ Đơn UGPhone đã được gửi lên Admin.');
            }catch(e){msg.innerHTML='<div class="msg danger">Không tạo được đơn: '+esc(e.message)+'</div>'}
          }
          </script>
          </section>'''
          modal=r'''<div id="ugOrderModal" class="modal"><div class="box"><button class="close" onclick="closeUgPhoneOrder()">✕</button><h2 id="ugOrderTitle">Đặt đơn UGPhone</h2><div class="msg">💰 Giá gói: <b id="ugOrderPrice">0 đ</b></div><div class="field"><label>ID Roblox</label><input id="ugRobloxAccount" autocomplete="off" placeholder="Nhập ID Roblox"></div><div class="field"><label>Mật khẩu Roblox</label><input id="ugRobloxPassword" type="password" autocomplete="off" placeholder="Nhập mật khẩu Roblox"></div><div class="field"><label>Mã dự phòng</label><input id="ugBackupCode" autocomplete="off" placeholder="Nhập mã dự phòng"></div><div id="ugOrderMsg"></div><button class="btn dark full" type="button" onclick="submitUgPhoneOrder()">ĐẶT ĐƠN</button></div></div>'''
          pattern=r'<section id="ugphone-services" class="section">.*?</section>'
          if re.search(pattern,s,re.S):
              s=re.sub(pattern,section,s,count=1,flags=re.S)
          else:
              s=s.replace('</main>',section+'\n</main>',1)
          if 'id="ugOrderModal"' not in s:
              s=s.replace('<script>\nconst SUPABASE_URL=',modal+'\n<script>\nconst SUPABASE_URL=',1)
          s=s.replace('<script src="ugphone.js"></script>\n','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add UGPhone order form with backup code'
          git push