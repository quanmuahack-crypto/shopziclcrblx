name: Fix UGPhone order form
on:
  push:
    paths-ignore:
      - 'index.html'
permissions:
  contents: write
jobs:
  fix-ugphone-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only UGPhone form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_modal='''<div id="ugOrderModal" class="modal"><div class="box"><button class="close" onclick="closeUgPhoneOrder()">✕</button><h2 id="ugOrderTitle">Đặt đơn UGPhone</h2><div class="msg">💰 Giá gói: <b id="ugOrderPrice">0 đ</b></div><div class="field"><label>ID UGPHONE của bạn:</label><input id="ugPhoneId" autocomplete="off" placeholder="Nhập ID UGPHONE của bạn"></div><div id="ugOrderMsg"></div><button class="btn dark full" type="button" onclick="submitUgPhoneOrder()">ĐẶT ĐƠN</button></div></div>'''
          modal_pattern=r'<div id="ugOrderModal" class="modal">.*?</div></div>'
          if re.search(modal_pattern,s,re.S):
              s=re.sub(modal_pattern,new_modal,s,count=1,flags=re.S)
          ug_start=s.find('<section id="ugphone-services"')
          ug_end=s.find('</section>',ug_start)
          if ug_start!=-1 and ug_end!=-1:
              ug=s[ug_start:ug_end]
              fn_pattern=r'function openUgPhoneOrder\(.*?</script>'
              new_functions='''function openUgPhoneOrder(service,packageName,price){
            if(typeof currentUser==='undefined'||!currentUser){if(typeof openAuth==='function')openAuth();else alert('Vui lòng đăng nhập trước.');return}
            window.ugSelected={service,packageName,price};
            document.getElementById('ugOrderTitle').textContent='Đặt đơn — '+packageName;
            document.getElementById('ugOrderPrice').textContent=Number(price).toLocaleString('vi-VN')+' đ';
            document.getElementById('ugPhoneId').value='';
            document.getElementById('ugOrderMsg').innerHTML='';
            document.getElementById('ugOrderModal').classList.add('show');
          }
          function closeUgPhoneOrder(){document.getElementById('ugOrderModal').classList.remove('show')}
          async function submitUgPhoneOrder(){
            const msg=document.getElementById('ugOrderMsg');
            if(!window.ugSelected)return;
            const ugPhoneId=document.getElementById('ugPhoneId').value.trim();
            if(!ugPhoneId){msg.innerHTML='<div class="msg danger">Vui lòng nhập ID UGPHONE của bạn.</div>';return}
            try{
              if(typeof refreshBalance==='function')await refreshBalance();
              if(Number(currentUser.balance||0)<window.ugSelected.price){msg.innerHTML='<div class="msg danger">Số dư không đủ. Vui lòng nạp tiền và chờ Admin duyệt.</div>';return}
              await api('orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:currentUser.id,service_name:window.ugSelected.service,package_name:window.ugSelected.packageName,price:window.ugSelected.price,status:'pending',game_username:ugPhoneId,game_password:'',extra_data:'ID UGPHONE: '+ugPhoneId})});
              if(typeof refreshBalance==='function')await refreshBalance();
              closeUgPhoneOrder();
              alert('✅ Đơn UGPhone đã được gửi lên Admin.');
            }catch(e){msg.innerHTML='<div class="msg danger">Không tạo được đơn: '+esc(e.message)+'</div>'}
          }
          </script>'''
              if re.search(fn_pattern,ug,re.S):
                  ug=re.sub(fn_pattern,new_functions,ug,count=1,flags=re.S)
                  s=s[:ug_start]+ug+s[ug_end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use UGPhone ID only in UGPhone order form'
          git push
