name: Embed UGPhone services
on:
  push:
    paths-ignore:
      - 'index.html'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the UGPhone section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          section=r'''<section id="ugphone-services" class="section">
          <style>
          .ugphone-main-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
          .ugphone-choice{position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#fff,#f3f6ff);border:1px solid #dfe5f3;transition:transform .18s,box-shadow .18s}
          .ugphone-choice:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0002}
          .ugphone-choice h3{margin:10px 0 6px;font-size:24px}
          .ugphone-choice p{margin:0;color:#667085}
          .ugphone-packages{display:none;margin-top:14px;padding:16px;border:1px solid #e5e9f0;border-radius:14px;background:#fafbff}
          .ugphone-packages.show{display:block}
          .ugphone-package-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
          .ugphone-package{background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:13px}
          .ugphone-package strong{display:block;margin-bottom:5px}
          @media(max-width:700px){.ugphone-main-grid,.ugphone-package-list{grid-template-columns:1fr}}
          </style>
          <h2>☁️ Dịch vụ UGPHONE</h2>
          <p>Chọn loại máy phù hợp nhu cầu treo Roblox.</p>
          <div class="ugphone-main-grid">
            <article class="card ugphone-choice">
              <div><div class="status">💎 GVIP</div><h3>UGPHONE GVIP</h3><p>Treo được 2–3 tab Roblox.</p></div>
              <button class="btn dark full" type="button" onclick="toggleUgPhonePackages('ug-gvip-packages')">XEM GÓI GVIP →</button>
            </article>
            <article class="card ugphone-choice">
              <div><div class="status">👑 SVIP</div><h3>UGPHONE SVIP</h3><p>Treo được 6 tab Roblox.</p></div>
              <button class="btn dark full" type="button" onclick="toggleUgPhonePackages('ug-svip-packages')">XEM GÓI SVIP →</button>
            </article>
          </div>
          <div id="ug-gvip-packages" class="ugphone-packages">
            <h3>💎 Các gói GVIP</h3><div class="ugphone-package-list">
              <div class="ugphone-package"><strong>GVIP 2 ngày</strong><span>30.000 đ</span></div>
              <div class="ugphone-package"><strong>GVIP 5 ngày</strong><span>35.000 đ</span></div>
              <div class="ugphone-package"><strong>GVIP 7 ngày</strong><span>40.000 đ</span></div>
              <div class="ugphone-package"><strong>GVIP 10 ngày</strong><span>55.000 đ</span></div>
              <div class="ugphone-package"><strong>GVIP 15 ngày</strong><span>75.000 đ</span></div>
              <div class="ugphone-package"><strong>GVIP 30 ngày</strong><span>150.000 đ</span></div>
            </div><p class="empty">📝 GVIP treo được 2–3 tab Roblox.</p>
          </div>
          <div id="ug-svip-packages" class="ugphone-packages">
            <h3>👑 Các gói SVIP</h3><div class="ugphone-package-list">
              <div class="ugphone-package"><strong>SVIP 7 ngày</strong><span>100.000 đ</span></div>
              <div class="ugphone-package"><strong>SVIP 15 ngày</strong><span>160.000 đ</span></div>
              <div class="ugphone-package"><strong>SVIP 30 ngày</strong><span>250.000 đ</span></div>
            </div><p class="empty">📝 SVIP treo được 6 tab Roblox.</p>
          </div>
          <script>
          function toggleUgPhonePackages(id){
            const target=document.getElementById(id);
            if(!target)return;
            document.querySelectorAll('.ugphone-packages').forEach(x=>{if(x!==target)x.classList.remove('show')});
            target.classList.toggle('show');
          }
          </script>
          </section>'''
          pattern=r'<section id="ugphone-services" class="section">.*?</section>'
          if re.search(pattern,s,re.S):
              s=re.sub(pattern,section,s,count=1,flags=re.S)
          else:
              s=s.replace('</main>',section+'\n</main>',1)
          s=s.replace('<script src="ugphone.js"></script>\n','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: simplify UGPhone into GVIP and SVIP cards'
          git push
