name: Fix admin login configuration

on:
  push:
    paths:
      - '.github/workflows/fix-admin-login-error.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          # Always use the shop's fixed Supabase project URL on every device.
          s=s.replace(
              "const SUPABASE_URL=window.SUPABASE_URL||localStorage.getItem('shopzicl_supabase_url');",
              "const SUPABASE_URL=window.SUPABASE_URL||'https://ufevipuhejvhiufyqqnz.supabase.co';"
          )

          # Keep the public/publishable key configurable per browser, but make bad
          # JSON/HTML responses show a useful error instead of 'Unexpected token <'.
          old=re.search(r'async function login\(\)\{.*?\n\}',s,re.S)
          if not old:
              raise SystemExit('login function not found')
          new='''async function login(){
  try{
    if(!SUPABASE_ANON_KEY) throw Error('Thiếu Supabase Publishable/anon key trên thiết bị này. Hãy cấu hình key trước khi đăng nhập.');
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em.value.trim(),password:pw.value})});
    const text=await r.text();
    let d={};
    try{d=text?JSON.parse(text):{}}catch{throw Error('Supabase trả về dữ liệu không hợp lệ (HTML thay vì JSON). Kiểm tra kết nối/project URL.');}
    if(!r.ok){
      const detail=d.error_description||d.msg||d.message||d.error||('HTTP '+r.status);
      throw Error('Supabase: '+detail);
    }
    if(!d.access_token) throw Error('Supabase không trả về access token.');
    token=d.access_token;localStorage.setItem('shopzicl_access_token',token);await init();
  }catch(e){
    alert('Đăng nhập thất bại\\n\\n'+(e?.message||String(e)));
  }
}'''
          s=s[:old.start()]+new+s[old.end():]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix admin login across devices'
          git push
