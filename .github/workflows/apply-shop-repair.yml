name: Apply shop repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[shop-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken VNG patch
        run: |
          cp _repair_vng_clean.js vng-to-international.js
          rm _repair_vng_clean.js
          rm .github/workflows/apply-shop-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add vng-to-international.js _repair_vng_clean.js .github/workflows/apply-shop-repair.yml
          git commit -m '[shop-repair] Restore service buttons and order forms'
          git push
