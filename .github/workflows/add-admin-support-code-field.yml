name: Add admin support-code display field

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old="<div>🛡️ <b>Mã dự phòng:</b> <span class=\"secret\">${esc(backup||'Chưa có')}</span></div>"
          new="<div>🛡️ <b>Mã hỗ trợ đăng nhập Roblox:</b> <span class=\"secret\">${esc(backup||'Chưa có')}</span></div>"
          if old not in s:
              raise SystemExit('Admin order field not found; no changes made')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Rename admin support code display field'
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm -f .github/workflows/add-admin-support-code-field.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time admin field workflow' || true
          git push || true
