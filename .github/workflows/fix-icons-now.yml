name: Fix service icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip icons]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update requested icons only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vng-to-international.js')
          s = p.read_text(encoding='utf-8')
          old = "'Robux 120H':'💰'"
          new = "'Robux 120H':'💎'"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Robux icon already correct or pattern not found')
          PY
      - name: Commit icon fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add vng-to-international.js
          git commit -m 'Fix requested service icons [skip icons]'
          git push
