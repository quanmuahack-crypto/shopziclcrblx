name: Rebuild deposit section
on:
  push:
    paths:
      - deposit-rebuild-trigger.txt
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace deposit UI and submit function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<select id="cardType">\n<option>Viettel</option>\n<option>Mobifone</option>\n<option>Vinaphone</option>\n<option>Garena</option>\n<option>Zing</option>\n</select>'''
          new='''<select id="cardType">\n<option value="Viettel">Viettel</option>\n<option value="Zing">Zing</option>\n</select>'''
          if old not in s: raise SystemExit('old card type block not found')
          s=s.replace(old,new,1)
          start=s.index('async function submitDeposit(){')
          end=s.index('\nfunction openOrder(name){', start)
          fn='''async function submitDeposit(){\n\nconst msg=document.getElementById('depositMsg');\nif(!currentUser){ openAuth(); return; }\n\nconst serial=document.getElementById('cardSerial').value.trim();\nconst code=document.getElementById('cardCode').value.trim();\nconst amount=Number(document.getElementById('cardAmount').value);\nconst type=document.getElementById('cardType').value;\n\nif(!['Viettel','Zing'].includes(type)){\nmsg.innerHTML='<div class="msg danger">Chỉ hỗ trợ Viettel và Zing.</div>';\nreturn;\n}\nif(!serial || !code){\nmsg.innerHTML='<div class="msg">Vui lòng nhập Seri và mã thẻ.</div>';\nreturn;\n}\n\ntry{\nconst r=await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_deposit_request',{\nmethod:'POST',\nheaders:{\n'apikey':SUPABASE_KEY,\n'Authorization':'Bearer '+(accessToken||SUPABASE_KEY),\n'Content-Type':'application/json'\n},\nbody:JSON.stringify({\np_user_id:currentUser.id,\np_card_type:type,\np_amount:amount,\np_serial:serial,\np_card_code:code\n})\n});\nconst text=await r.text();\nif(!r.ok) throw Error(text||r.statusText);\n\ndocument.getElementById('cardSerial').value='';\ndocument.getElementById('cardCode').value='';\nmsg.innerHTML='<div class="msg success">✅ Đã gửi yêu cầu nạp. Vui lòng chờ Admin duyệt.</div>';\n}catch(e){\nmsg.innerHTML='<div class="msg danger">'+esc(e.message)+'</div>';\n}\n}\n'''
          s=s[:start]+fn+s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild deposit UI for Viettel and Zing" || exit 0
          git push
