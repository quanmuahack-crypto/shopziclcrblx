name: Fix UGPhone order fields

on:
  push:
    paths:
      - '.github/workflows/fix-ugphone-order-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace UGPhone order form only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_modal = r'''<div id="ugOrderModal" class="modal"><div class="box"><button class="close" onclick="closeUgPhoneOrder()">✕</button><h2 id="ugOrderTitle">Đặt đơn UGPhone</h2><div class="msg">💰 Giá gói: <b id="ugOrderPrice">0 đ</b></div><div class="field"><label>ID Roblox</label><input id="ugRobloxAccount" autocomplete="off" placeholder="Nhập ID Roblox"></div><div class="field"><label>Mật khẩu Roblox</label><input id="ugRobloxPassword" type="password" autocomplete="off" placeholder="Nhập mật khẩu Roblox"></div><div class="field"><label>Mã dự phòng</label><input id="ugBackupCode" autocomplete="off" placeholder="Nhập mã dự phòng"></div><div id="ugOrderMsg"></div><button class="btn dark full" type="button" onclick="submitUgPhoneOrder()">ĐẶT ĐƠN</button></div></div>'''
          new_modal = r'''<div id="ugOrderModal" class="modal"><div class="box"><button class="close" onclick="closeUgPhoneOrder()">✕</button><h2 id="ugOrderTitle">Đặt đơn UGPhone</h2><div class="msg">💰 Giá gói: <b id="ugOrderPrice">0 đ</b></div><div class="field"><label>ID UGPHONE của bạn</label><input id="ugUgphoneId" autocomplete="off" placeholder="Nhập ID UGPHONE của bạn"></div><div id="ugOrderMsg"></div><button class="btn dark full" type="button" onclick="submitUgPhoneOrder()">ĐẶT ĐƠN</button></div></div>'''
          if old_modal not in s:
              raise SystemExit('UGPhone modal pattern not found; no changes made')
          s = s.replace(old_modal, new_modal, 1)

          old_fields = '''    const account=document.getElementById('ugRobloxAccount').value.trim();\n    const password=document.getElementById('ugRobloxPassword').value;\n    const backup=document.getElementById('ugBackupCode').value.trim();\n    if(!account||!password||!backup){msg.innerHTML='<div class="msg danger">Vui lòng nhập ID, mật khẩu và mã dự phòng.</div>';return}'''
          new_fields = '''    const ugphoneId=document.getElementById('ugUgphoneId').value.trim();\n    if(!ugphoneId){msg.innerHTML='<div class="msg danger">Vui lòng nhập ID UGPHONE của bạn.</div>';return}'''
          if old_fields not in s:
              raise SystemExit('UGPhone submit fields pattern not found; no changes made')
          s = s.replace(old_fields, new_fields, 1)

          old_reset = '''  document.getElementById('ugRobloxAccount').value='';\n  document.getElementById('ugRobloxPassword').value='';\n  document.getElementById('ugBackupCode').value='';'''
          new_reset = '''  document.getElementById('ugUgphoneId').value='';'''
          if old_reset not in s:
              raise SystemExit('UGPhone reset pattern not found; no changes made')
          s = s.replace(old_reset, new_reset, 1)

          old_payload = "game_username:account,game_password:password,extra_data:'Mã dự phòng: '+backup"
          new_payload = "game_username:ugphoneId,extra_data:'ID UGPHONE: '+ugphoneId"
          if old_payload not in s:
              raise SystemExit('UGPhone payload pattern not found; no changes made')
          s = s.replace(old_payload, new_payload, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use UGPhone ID for UGPhone orders'
          git push