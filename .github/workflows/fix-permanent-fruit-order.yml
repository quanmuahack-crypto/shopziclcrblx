name: Fix permanent fruit order form
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only permanent fruit order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=r'''function openPermanentFruitOrder\(name,robux,price\)\{.*?\n\}\nasync function sendPermanentFruitOrder\(name,robux,price\)\{'''
          new=r'''function openPermanentFruitOrder(name,robux,price){
            if(typeof currentUser==='undefined'||!currentUser){if(typeof openAuth==='function')openAuth();else alert('Vui lòng đăng nhập trước.');return}
            window._pfOrder={name,robux,price};
            const modal=document.getElementById('pf-order-modal');
            const summary=document.getElementById('pf-order-summary');
            if(summary)summary.textContent=name+' • '+Number(price).toLocaleString('vi-VN')+' đ';
            if(modal)modal.classList.add('show');
          }
          function closePermanentFruitOrder(){const m=document.getElementById('pf-order-modal');if(m)m.classList.remove('show')}
          async function submitPermanentFruitOrder(){
            const o=window._pfOrder;if(!o)return;
            const username=(document.getElementById('pf-roblox-username')||{}).value?.trim()||'';
            const phone=(document.getElementById('pf-phone')||{}).value?.trim()||'';
            if(!username||!phone){alert('Vui lòng nhập Username/ID Roblox và số điện thoại.');return}
            try{
              if(typeof refreshBalance==='function')await refreshBalance();
              if(Number(currentUser.balance||0)<o.price){alert('Số dư không đủ. Vui lòng nạp tiền trước.');return}
              await api('orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:currentUser.id,service_name:'TRÁI VĨNH VIỄN BF',package_name:o.name,price:o.price,status:'pending',game_username:username,game_password:'',extra_data:'Trái vĩnh viễn Blox Fruits • '+o.robux+' Robux • SĐT: '+phone})});
              closePermanentFruitOrder();
              document.getElementById('pf-roblox-username').value='';document.getElementById('pf-phone').value='';
              alert('✅ Đã gửi đơn '+o.name+' lên Admin.');
            }catch(e){alert('Không tạo được đơn: '+(e.message||e))}
          }
          async function sendPermanentFruitOrder(name,robux,price){return openPermanentFruitOrder(name,robux,price)}
          async function __unusedPermanentFruitOrder(name,robux,price){'''
          s2,n=re.subn(old,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Không tìm thấy hàm Trái VV hiện tại: {n}')
          s=s2
          modal=r'''<div id="pf-order-modal" class="modal" aria-hidden="true"><div class="box" style="width:min(520px,100%);border:2px solid #f1c40f"><button class="close" type="button" onclick="closePermanentFruitOrder()">✕</button><h2>🍇 ĐẶT TRÁI VĨNH VIỄN BF</h2><div id="pf-order-summary" class="msg success">Gói đã chọn</div><div class="field"><label>Username / ID Roblox</label><input id="pf-roblox-username" autocomplete="off" placeholder="Nhập username hoặc ID Roblox"></div><div class="field"><label>Số điện thoại</label><input id="pf-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Nhập số điện thoại"></div><div class="msg">Chỉ cần Username/ID Roblox và số điện thoại. Không yêu cầu mật khẩu hoặc mã đăng nhập Roblox.</div><button class="btn dark full" type="button" onclick="submitPermanentFruitOrder()">XÁC NHẬN ĐẶT ĐƠN</button></div></div>'''
          if 'id="pf-order-modal"' not in s:
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('Không tìm thấy </body>')
              s=s[:pos]+modal+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: separate permanent fruit order form'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-permanent-fruit-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-permanent-fruit-order.yml
          git diff --cached --quiet || git commit -m 'chore: remove one-time fruit order workflow'
          git push || true