name: Fix Combo Toc V4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-combo-toc-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Combo Toc V4 packages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="'Combo Tộc V4':[['Combo 3 Tộc V4 Full Gear',110000],['Combo 4 Tộc V4 Full Gear',145000],['Combo 5 Tộc V4 Full Gear',180000],['Combo 6 Tộc V4 Full Gear',215000]]"
          new="'Combo Tộc V4':[['Combo 3 Tộc V4 Full Gear',110000],['Combo 4 Tộc V4 Full Gear',145000],['Combo 5 Tộc V4 Full Gear',180000],['Combo 6 Tộc V4 Full Gear',215000],['👹 Lấy tộc Quỷ (bao V2–V3)',15000],['🤖 Lấy tộc Cyborg (bao V2–V3)',20000],['🔧 Pull Lever (yêu cầu cần có Mảnh Gương và Mũ Rip)',10000]]"
          if new in s:
              print('packages already present')
          elif old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('patched Combo Tộc V4')
          else:
              raise SystemExit('Combo Tộc V4 catalog entry not found; no changes made')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add packages to Combo Toc V4" || true
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/fix-combo-toc-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Combo Toc V4 workflow" || true
          git push
