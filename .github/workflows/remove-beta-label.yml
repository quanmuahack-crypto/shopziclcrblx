name: Remove beta wording

on:
  push:
    paths:
      - '.github/workflows/remove-beta-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove beta wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('⚡ BẢN THỬ NGHIỆM', ''),
              ('BẢN THỬ NGHIỆM', ''),
              ('Bản thử nghiệm:', ''),
              ('Bản thử nghiệm', ''),
              ('bản thử nghiệm', ''),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Remove beta wording from website'
          git push
