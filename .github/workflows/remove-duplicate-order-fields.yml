name: Remove duplicate phone and login support fields

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-duplicate-order-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only one phone field and one login-support field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove duplicate order-form fields while preserving the first one.
          # Only targets field blocks whose label/input clearly refers to phone
          # number or Roblox login-support code.
          field_re = re.compile(r'<div\s+class=["\']field["\'][^>]*>.*?</div>\s*', re.I | re.S)
          blocks = list(field_re.finditer(s))
          seen_phone = False
          seen_support = False
          remove = []

          for m in blocks:
              block = m.group(0)
              plain = re.sub(r'<[^>]+>', ' ', block).lower()
              if any(x in plain for x in ['số điện thoại', 'sđt', 'so dien thoai', 'phone number', 'phone']):
                  if seen_phone:
                      remove.append((m.start(), m.end()))
                  else:
                      seen_phone = True
              elif any(x in plain for x in ['mã hỗ trợ đăng nhập', 'mã hỗ trợ', 'login support', 'support code', 'mã dự phòng']):
                  if seen_support:
                      remove.append((m.start(), m.end()))
                  else:
                      seen_support = True

          for a, b in reversed(remove):
              s = s[:a] + s[b:]

          p.write_text(s, encoding='utf-8')
          print('phone fields kept:', seen_phone, 'support fields kept:', seen_support, 'duplicates removed:', len(remove))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove duplicate phone and login support fields'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/remove-duplicate-order-fields.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove duplicate-field workflow' || true
          git push || true
