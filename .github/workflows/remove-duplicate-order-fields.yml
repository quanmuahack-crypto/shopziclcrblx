name: Remove duplicate phone and login support fields

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-order-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exactly one phone and support-code field
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The source modal should contain one of each. Remove duplicate .field blocks
          # only when their label identifies them as phone/support-code fields.
          field_re = re.compile(r'<div\s+class=["\']field["\'][\s\S]*?</div>', re.I)
          order_re = re.compile(r'<div\s+id=["\']orderModal["\'][\s\S]*?</div>\s*<div\s+id=["\']ugOrderModal["\']', re.I)

          def clean_segment(seg):
              seen_phone = False
              seen_support = False
              def repl(m):
                  nonlocal seen_phone, seen_support
                  block = m.group(0)
                  text = re.sub(r'<[^>]+>', ' ', block).lower()
                  if 'số điện thoại' in text or 'sđt' in text:
                      if seen_phone:
                          return ''
                      seen_phone = True
                  if 'mã hỗ trợ đăng nhập' in text:
                      if seen_support:
                          return ''
                      seen_support = True
                  return block
              return field_re.sub(repl, seg)

          m = order_re.search(s)
          if m:
              s = s[:m.start()] + clean_segment(m.group(0)) + s[m.end()-len('<div id="ugOrderModal"'):]

          # Runtime safety net: if an older cached script or another renderer inserts duplicates,
          # keep only the first phone field and first support-code field inside orderModal.
          guard = '''\n<script>\n(function(){\n  function oneEach(){\n    var root=document.getElementById('orderModal');\n    if(!root)return;\n    var phone=false,support=false;\n    root.querySelectorAll('.field').forEach(function(f){\n      var label=(f.querySelector('label')?.textContent||'').toLowerCase().replace(/\\s+/g,' ').trim();\n      if(label.includes('số điện thoại')||label.includes('sđt')){\n        if(phone) f.remove(); else phone=true;\n      }else if(label.includes('mã hỗ trợ đăng nhập')){\n        if(support) f.remove(); else support=true;\n      }\n    });\n  }\n  oneEach();\n  document.addEventListener('DOMContentLoaded',oneEach);\n  new MutationObserver(oneEach).observe(document.body,{childList:true,subtree:true});\n})();\n</script>\n'''
          if 'function oneEach(){' not in s:
              s = s.replace('</body>', guard + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched shop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep exactly one phone and support field in order form'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/remove-duplicate-order-fields.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time duplicate-field workflow' || true
          git push || true
