name: Remove duplicate phone and login support fields

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-order-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate order fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the second and later phone/support-code .field blocks from the order modal.
          # Keep the first occurrence so existing submit logic continues to use it.
          def remove_duplicates(text, phrases):
              seen = {x: 0 for x in phrases}
              pattern = re.compile(r'<div\s+class=["\']field["\'][\s\S]*?</div>', re.I)
              def repl(m):
                  block = m.group(0)
                  low = re.sub(r'<[^>]+>', ' ', block).lower()
                  for phrase in phrases:
                      if phrase in low:
                          seen[phrase] += 1
                          if seen[phrase] > 1:
                              return ''
                          break
                  return block
              return pattern.sub(repl, text)

          # Limit the cleanup to the order modal when it exists; this avoids touching unrelated forms.
          modal_names = ['orderModal', 'permanentFruitOrderModal']
          for modal_id in modal_names:
              marker = f'id="{modal_id}"'
              pos = s.find(marker)
              if pos < 0:
                  continue
              start = s.rfind('<div', 0, pos)
              if start < 0:
                  continue
              # Find the next modal close conservatively by locating the next </div>\n<script or end.
              end = s.find('</body>', pos)
              if end < 0:
                  end = len(s)
              segment = s[start:end]
              cleaned = remove_duplicates(segment, ['số điện thoại', 'mã hỗ trợ đăng nhập roblox', 'mã hỗ trợ đăng nhập'])
              s = s[:start] + cleaned + s[end:]

          # Also add a runtime guard so any duplicate dynamically-rendered fields are hidden.
          guard = r'''<script>
(function(){
  function cleanOrderFields(){
    var root=document.getElementById('orderModal')||document;
    var seen={phone:false,support:false};
    root.querySelectorAll('.field').forEach(function(el){
      var label=(el.querySelector('label')?.textContent||'').toLowerCase().trim();
      var type=label.includes('số điện thoại')?'phone':(label.includes('mã hỗ trợ đăng nhập')?'support':null);
      if(!type)return;
      if(seen[type]) el.remove(); else seen[type]=true;
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cleanOrderFields); else cleanOrderFields();
  new MutationObserver(cleanOrderFields).observe(document.body,{childList:true,subtree:true});
})();
</script>'''
          if 'function cleanOrderFields()' not in s:
              s = s.replace('</body>', guard + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched shop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remove duplicate phone and login support fields'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/remove-duplicate-order-fields.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove duplicate-field workflow' || true
          git push || true
