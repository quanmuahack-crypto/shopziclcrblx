name: Stabilize shop loading
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stabilize-shop-loading.yml'
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) vng-to-international.js was injecting a second phone and support-code
          #    field into the main order modal. The main index.html already contains
          #    the canonical fields, so remove that injector entirely.
          p = Path('vng-to-international.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"function addPhoneField\(\).*?\nfunction addSupportNoteField\(\).*?\nfunction patchSubmitOrder\(\).*?\nfunction boot\(\).*?\}\)\(\);", "function boot(){}", s, flags=re.S)
          # Also remove any leftover observer/load hooks from an older variant.
          s = re.sub(r"window\.addEventListener\('load'.*?\);new MutationObserver\(.*?\.observe\(document\.documentElement,\{childList:true,subtree:true\}\);", "", s, flags=re.S)
          p.write_text(s, encoding='utf-8')

          # 2) Prevent the TOP 5 RPC from leaving the page looking like it is
          #    permanently loading when the RPC/network is slow or unavailable.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_top5_depositors',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+(accessToken||SUPABASE_KEY),'Content-Type':'application/json'},body:'{}',cache:'no-store'});"
          new = "const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),6000);const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_top5_depositors',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+(accessToken||SUPABASE_KEY),'Content-Type':'application/json'},body:'{}',cache:'no-store',signal:ac.signal});clearTimeout(tm);"
          if old in s: s=s.replace(old,new,1)
          # Disable the duplicate TOP-5 rebuild listener; the main renderTop5 is sufficient.
          s=s.replace("document.addEventListener('DOMContentLoaded',rebuildTopDeposit);","// duplicate TOP-5 rebuild disabled; renderTop5 handles this once")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit frontend stabilization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vng-to-international.js
          git diff --cached --quiet || git commit -m 'fix: stop duplicate fields and prevent top loading hang'
          git push
      - name: Remove one-time workflow
        run: |
          git rm -f .github/workflows/stabilize-shop-loading.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove stabilization workflow' || true
          git push || true
