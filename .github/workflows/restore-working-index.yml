name: Restore working shop index

on:
  push:
    paths:
      - '.github/workflows/restore-working-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index from last known working order version
        run: |
          git fetch --no-tags origin 2f90663876672a8f3bd48fec1ebbb68ab2bb3158
          git checkout 2f90663876672a8f3bd48fec1ebbb68ab2bb3158 -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already matches the known-good version'
          else
            git commit -m 'fix: restore shop to known working index'
            git push
          fi
