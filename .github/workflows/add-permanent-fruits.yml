              <div class="pf-package"><div><strong>Light</strong><span>1,100 Robux</span></div><b>165,000 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Light',1100,165000)">MUA GÓI</button></div>
              <div class="pf-package"><div><strong>Diamond</strong><span>1,000 Robux</span></div><b>150,000 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Diamond',1000,150000)">MUA GÓI</button></div>
              <div class="pf-package"><div><strong>Dark</strong><span>950 Robux</span></div><b>142,500 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Dark',950,142500)">MUA GÓI</button></div>
              <div class="pf-package"><div><strong>Ice</strong><span>750 Robux</span></div><b>112,500 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Ice',750,112500)">MUA GÓI</button></div>
              <div class="pf-package"><div><strong>Flame</strong><span>550 Robux</span></div><b>82,500 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Flame',550,82500)">MUA GÓI</button></div>
            </div>
          </div>
          <script>
          function togglePermanentFruitPackages(){document.getElementById('pf-packages').classList.toggle('show')}
          function openPermanentFruitOrder(name,robux,price){
            if(typeof currentUser==='undefined'||!currentUser){if(typeof openAuth==='function')openAuth();else alert('Vui lòng đăng nhập trước.');return}
            const ok=confirm('Bạn có muốn đặt trái vĩnh viễn '+name+' với giá '+Number(price).toLocaleString('vi-VN')+' đ không?');
            if(!ok)return;
            if(typeof refreshBalance==='function')refreshBalance().then(()=>sendPermanentFruitOrder(name,robux,price));else sendPermanentFruitOrder(name,robux,price)
          }
          async function sendPermanentFruitOrder(name,robux,price){
            try{
              if(Number(currentUser.balance||0)<price){alert('Số dư không đủ. Vui lòng nạp tiền trước.');return}
              await api('orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:currentUser.id,service_name:'TRÁI VĨNH VIỄN BF',package_name:name,price:price,status:'pending',game_username:'',game_password:'',extra_data:'Trái vĩnh viễn Blox Fruits • '+robux+' Robux'})});
              alert('✅ Đã gửi đơn '+name+' lên Admin.');
            }catch(e){alert('Không tạo được đơn: '+(e.message||e))}
          }
          </script>
          </section>
          '''
          if marker not in s: raise SystemExit('marker not found')
          s=s.replace(marker, block+'\n'+marker, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add permanent Blox Fruits service to shop'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/add-permanent-fruits.yml
          git commit -m 'Remove permanent fruit service workflow'
          git push
