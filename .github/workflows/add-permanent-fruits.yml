              <div class="pf-package"><div><strong>Phoenix</strong><span>2,000 Robux</span></div><b>300,000 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Phoenix',2000,300000)">MUA GÓI</button></div>
              <div class="pf-package"><div><strong>Portal</strong><span>2,000 Robux</span></div><b>300,000 đ</b><button class="btn dark" type="button" onclick="openPermanentFruitOrder('Portal',2000,300000)">MUA GÓI</button></div>
