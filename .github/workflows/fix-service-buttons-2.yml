name: Fix service buttons 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch button handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          target="onclick=\\\"openOrder('+JSON.stringify(k)+')\\\""
          replacement="onclick=\\\"openOrder(\\\'"+"'+esc(k)+'"+"\\\')\\\""
          if target not in s:
              print('target not found; current pattern search:', "JSON.stringify(k)" in s)
              raise SystemExit(1)
          s=s.replace(target,replacement)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make service buttons clickable'
          git push