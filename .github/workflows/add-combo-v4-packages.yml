name: Add Combo Tộc V4 packages
on:
  push:
    paths:
      - '.github/workflows/add-combo-v4-packages.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Combo Tộc V4 catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="'Combo Tộc V4':[['Combo 3 Tộc V4 Full Gear',110000],['Combo 4 Tộc V4 Full Gear',145000],['Combo 5 Tộc V4 Full Gear',180000],['Combo 6 Tộc V4 Full Gear',215000]],"
          new="'Combo Tộc V4':[['Combo 3 Tộc V4 Full Gear',110000],['Combo 4 Tộc V4 Full Gear',145000],['Combo 5 Tộc V4 Full Gear',180000],['Combo 6 Tộc V4 Full Gear',215000],['Lấy tộc Quỷ (bao V2-V3)',15000],['Lấy tộc Cyborg (bao V2-V3)',20000],['Pull Lever (yêu cầu cần có mảnh gương và mũ rip)',10000]],"
          if old not in s:
              raise SystemExit('Không tìm thấy catalog Combo Tộc V4; dừng để không ảnh hưởng phần khác.')
          if "'Lấy tộc Quỷ (bao V2-V3)'" in s or "'Pull Lever (yêu cầu cần có mảnh gương và mũ rip)'" in s:
              raise SystemExit('Các gói đã tồn tại; không thay đổi gì.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add Combo Tộc V4 packages'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/add-combo-v4-packages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/add-combo-v4-packages.yml
          git diff --cached --quiet || git commit -m 'chore: remove one-time Combo Tộc V4 workflow'
          git push || true