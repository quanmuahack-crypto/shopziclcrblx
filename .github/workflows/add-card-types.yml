name: Add extra card types
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only card recharge UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<option value="Viettel">Viettel</option><option value="Zing">Zing</option>'
          new=old+'<option value="Mobifone">Mobifone</option><option value="Vinaphone">Vinaphone</option><option value="Scoin">Scoin</option><option value="Vcoin">Vcoin</option><option value="Garena">Garena</option>'
          if old not in s:
              raise SystemExit('Không tìm thấy danh sách nhà mạng hiện tại; dừng để không ảnh hưởng phần khác')
          s=s.replace(old,new,1)
          s=s.replace('Chỉ hỗ trợ Viettel và Zing. Admin sẽ kiểm tra và duyệt thủ công.','Hỗ trợ Viettel, Zing, Mobifone, Vinaphone, Scoin, Vcoin và Garena. Admin sẽ kiểm tra và duyệt thủ công.',1)
          oldcheck="if(!['Viettel','Zing'].includes(type)){msg.innerHTML='<div class=\"msg danger\">Chỉ hỗ trợ Viettel và Zing.</div>';return;}"
          newcheck="if(!['Viettel','Zing','Mobifone','Vinaphone','Scoin','Vcoin','Garena'].includes(type)){msg.innerHTML='<div class=\"msg danger\">Loại thẻ không được hỗ trợ.</div>';return;}"
          if oldcheck in s:
              s=s.replace(oldcheck,newcheck,1)
          else:
              raise SystemExit('Không tìm thấy kiểm tra loại thẻ; dừng để không ảnh hưởng phần khác')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add Mobifone Vinaphone Scoin Vcoin Garena cards'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/add-card-types.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/add-card-types.yml
          git diff --cached --quiet || git commit -m 'chore: remove one-time card types workflow'
          git push || true