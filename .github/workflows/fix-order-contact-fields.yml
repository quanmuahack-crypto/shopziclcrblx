name: Fix order contact and login support fields

on:
  push:
    paths:
      - '.github/workflows/fix-order-contact-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer order form and admin display
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_modal = '<div id="orderModal" class="modal"><div class="box"><button class="close" onclick="closeOrder()">✕</button><h2 id="orderTitle">Đặt đơn</h2><div class="field"><label>Gói dịch vụ</label><select id="package"></select></div><div class="field"><label>Tài khoản Roblox</label><input id="robloxAccount" autocomplete="off"></div><div class="field"><label>Mật khẩu Roblox</label><input id="robloxPassword" type="password" autocomplete="off"></div><div class="msg">⚠️ Chỉ nhập thông tin cần thiết cho đơn.</div><button class="btn dark full" onclick="submitOrder()">ĐẶT ĐƠN</button></div></div>'
          new_modal = '<div id="orderModal" class="modal"><div class="box"><button class="close" onclick="closeOrder()">✕</button><h2 id="orderTitle">Đặt đơn</h2><div class="field"><label>Gói dịch vụ</label><select id="package"></select></div><div class="field"><label>Tài khoản Roblox</label><input id="robloxAccount" autocomplete="off"></div><div class="field"><label>Mật khẩu Roblox</label><input id="robloxPassword" type="password" autocomplete="off"></div><div class="field"><label>Số điện thoại</label><input id="robloxPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Nhập số điện thoại"></div><div class="field"><label>Mã hỗ trợ đăng nhập Roblox</label><input id="robloxSupportCode" autocomplete="off" placeholder="Nhập mã hỗ trợ đăng nhập"></div><div class="msg">⚠️ Thông tin số điện thoại và mã hỗ trợ đăng nhập sẽ được lưu cùng đơn để Admin xử lý.</div><button class="btn dark full" onclick="submitOrder()">ĐẶT ĐƠN</button></div></div>'
          if old_modal not in s:
              raise SystemExit('order modal pattern not found; no changes made')
          s = s.replace(old_modal, new_modal, 1)

          old_submit = "async function submitOrder(){if(!currentUser)return openAuth();await refreshBalance();const i=Number(document.getElementById('package').value),p=catalog[selectedService][i],account=document.getElementById('robloxAccount').value.trim(),password=document.getElementById('robloxPassword').value;if(!account||!password)return alert('Nhập đủ tài khoản và mật khẩu Roblox.');if(Number(currentUser.balance||0)<p[1])return alert('Số dư không đủ. Vui lòng nạp tiền và chờ Admin duyệt.');try{await api('orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:currentUser.id,service_name:selectedService,package_name:p[0],price:p[1],status:'pending',account,password})});await refreshBalance();closeOrder();alert('Đơn đã được gửi lên hệ thống. Admin sẽ xử lý.')}catch(e){alert('Không tạo được đơn: '+e.message)}}"
          new_submit = "async function submitOrder(){if(!currentUser)return openAuth();await refreshBalance();const i=Number(document.getElementById('package').value),p=catalog[selectedService][i],account=document.getElementById('robloxAccount').value.trim(),password=document.getElementById('robloxPassword').value,phone=document.getElementById('robloxPhone').value.trim(),supportCode=document.getElementById('robloxSupportCode').value.trim();if(!account||!password||!phone||!supportCode)return alert('Nhập đủ ID Roblox, mật khẩu, số điện thoại và mã hỗ trợ đăng nhập.');if(Number(currentUser.balance||0)<p[1])return alert('Số dư không đủ. Vui lòng nạp tiền và chờ Admin duyệt.');try{await api('orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:currentUser.id,service_name:selectedService,package_name:p[0],price:p[1],status:'pending',account,password,game_username:account,game_password:password,extra_data:JSON.stringify({phone:phone,phone_number:phone,support_code:supportCode,login_support_code:supportCode})})});await refreshBalance();document.getElementById('robloxAccount').value='';document.getElementById('robloxPassword').value='';document.getElementById('robloxPhone').value='';document.getElementById('robloxSupportCode').value='';closeOrder();alert('Đơn đã được gửi lên hệ thống. Admin sẽ xử lý.')}catch(e){alert('Không tạo được đơn: '+e.message)}}"
          if old_submit not in s:
              raise SystemExit('submitOrder pattern not found; no changes made')
          s = s.replace(old_submit, new_submit, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old_backup = "for(const k of ['backup_code','backupCode','recovery_code','recoveryCode','backup','recovery','ma_du_phong','maDuPhong'])"
          new_backup = "for(const k of ['support_code','login_support_code','loginSupportCode','backup_code','backupCode','recovery_code','recoveryCode','backup','recovery','ma_du_phong','maDuPhong'])"
          if old_backup in s:
              s = s.replace(old_backup, new_backup, 1)
          else:
              raise SystemExit('backupCode helper pattern not found; no changes made')
          old_label = '<div>🛡️ <b>Mã dự phòng:</b> <span class="secret">${esc(backup||\'Chưa có\')}</span></div>'
          new_label = '<div>🛡️ <b>Mã hỗ trợ đăng nhập Roblox:</b> <span class="secret">${esc(backup||\'Chưa có\')}</span></div>'
          if old_label in s:
              s = s.replace(old_label, new_label, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: save phone and login support code on orders'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-order-contact-fields.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time order fields workflow' || true
          git push || true
