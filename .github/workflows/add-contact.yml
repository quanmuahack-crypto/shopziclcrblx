name: Add contact section
on:
  push:
    paths-ignore:
      - 'index.html'
permissions:
  contents: write
jobs:
  add-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contact section only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="contact-section"'
          if marker in s:
              print('Contact section already exists')
              raise SystemExit(0)
          section='''<section id="contact-section" class="section"><h2>📞 Liên Hệ</h2><p>Nếu cần hỗ trợ, hãy tham gia Discord của shop.</p><a href="https://discord.gg/VTYgy5qrv" target="_blank" rel="noopener noreferrer" class="btn dark" style="display:inline-block;text-decoration:none">Nhấn vào đây</a></section>'''
          if '</main>' not in s:
              raise SystemExit('Không tìm thấy </main>')
          s=s.replace('</main>',section+'\n</main>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add Discord contact section'
          git push
