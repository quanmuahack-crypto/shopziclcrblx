name: Add Combo Toc V4 packages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/combo-v4-packages.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Combo Tộc V4 only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- COMBO_V4_PACKAGES_V1 -->'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          inject = r'''<!-- COMBO_V4_PACKAGES_V1 -->
<style>
.combo-v4-extra{margin-top:14px;padding:14px;border:1px solid #e5e9f0;border-radius:14px;background:#fafbff}
.combo-v4-extra h4{margin:0 0 10px}.combo-v4-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.combo-v4-item{background:#fff;border:1px solid #e5e9f0;border-radius:12px;padding:12px}.combo-v4-item strong{display:block}.combo-v4-item span{display:block;color:#667085;font-size:13px;margin-top:4px}.combo-v4-item b{display:block;margin-top:7px}
@media(max-width:800px){.combo-v4-list{grid-template-columns:1fr}}
</style>
<script>
(function(){
  function addComboPackages(){
    var cards=[].slice.call(document.querySelectorAll('.card,.section,[class*="card"]'));
    var target=cards.find(function(el){return /Combo\s*Tộc\s*V4/i.test(el.textContent||'') && !el.querySelector('.combo-v4-extra');});
    if(!target)return false;
    var box=document.createElement('div');box.className='combo-v4-extra';
    box.innerHTML='<h4>🔥 Gói bổ sung Combo Tộc V4</h4><div class="combo-v4-list">'+
      '<div class="combo-v4-item"><strong>👹 Lấy tộc Quỷ</strong><span>Bao V2–V3</span><b>15.000 đ</b></div>'+\
      '<div class="combo-v4-item"><strong>🤖 Lấy tộc Cyborg</strong><span>Bao V2–V3</span><b>20.000 đ</b></div>'+\
      '<div class="combo-v4-item"><strong>🔧 Pull Lever</strong><span>Yêu cầu có Mảnh Gương + Mũ Rip</span><b>10.000 đ</b></div></div>';
    target.appendChild(box);return true;
  }
  if(!addComboPackages()){
    var obs=new MutationObserver(function(){if(addComboPackages())obs.disconnect();});
    obs.observe(document.body,{childList:true,subtree:true});setTimeout(function(){obs.disconnect();},15000);
  }
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('index.html has no closing body tag')
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add packages to Combo Tộc V4 only'
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/combo-v4-packages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary combo patch workflow'
          git push || true
