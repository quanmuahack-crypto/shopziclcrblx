name: Repair Top 5 data source
on:
  push:
    paths:
      - '.github/workflows/fix-top5-data.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only renderTop5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="async function renderTop5(){const el=document.getElementById('top5');try{const rows=await api('profiles?select=username,balance&role=eq.customer&order=balance.desc&limit=5');el.innerHTML=(rows||[]).map((x,i)=>'<div class=\"top-card\"><div class=\"rank\">🏆 TOP '+(i+1)+'</div><strong>'+esc(x.username)+'</strong><div>'+money(x.balance)+'</div></div>').join('')||'<div class=\"empty\">Chưa có dữ liệu</div>'}catch(e){el.innerHTML='<div class=\"empty\">Chưa có dữ liệu</div>'}}"
          new="""async function renderTop5(){const el=document.getElementById('top5');if(!el)return;try{const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_top5_depositors',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+(accessToken||SUPABASE_KEY),'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!r.ok)throw Error(await r.text());const rows=await r.json();const medals=['🥇','🥈','🥉','🏅','🏅'];el.innerHTML=Array.from({length:5},(_,i)=>{const x=rows[i];return x?'<div class=\"top-card\"><div class=\"rank\">'+medals[i]+' TOP '+(i+1)+'</div><strong>'+esc(x.username||'Ẩn danh')+'</strong><div>'+money(x.total_deposit||0)+'</div></div>':'<div class=\"top-card\"><div class=\"rank\">'+medals[i]+' TOP '+(i+1)+'</div><div class=\"empty\">Chưa có dữ liệu</div></div>'}).join('')}catch(e){console.error('renderTop5',e);el.innerHTML=Array.from({length:5},(_,i)=>'<div class=\"top-card\"><div class=\"rank\">🏆 TOP '+(i+1)+'</div><div class=\"empty\">Không tải được dữ liệu</div></div>').join('')}}"""
          if old not in s:
              raise SystemExit('renderTop5 target not found; no changes made')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: Top 5 reads approved deposits'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-top5-data.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-top5-data.yml
          git diff --cached --quiet || git commit -m 'chore: remove Top 5 repair workflow'
          git push || true