name: Emergency repair shop HTML
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-repair-shop.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div id="ugOrderModal"<div id="ugOrderModal" class="modal">','<div id="ugOrderModal" class="modal">')
          for ident in ('robloxPhone','robloxSupportCode'):
              pat=re.compile(r'<input\b[^>]*\bid=["\']'+ident+r'["\'][^>]*>',re.I)
              ms=list(pat.finditer(s))
              for m in reversed(ms[1:]): s=s[:m.start()]+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: repair malformed shop html'
          git push
