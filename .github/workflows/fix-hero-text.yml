name: Fix hero banner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: replace hero with text') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace banner with plain text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section class="hero"><h1>Cày thuê Blox Fruits</h1><p>Dịch vụ Gamepass, Trái ác quỷ và nhiều dịch vụ khác</p></section>'
          new = '<section class="hero"><h1>Cày thuê Blox Fruits, Gamepass, Trái ác quỷ vv,...</h1></section>'
          s = s.replace(old, new)
          s = s.replace('.hero{background:linear-gradient(135deg,#101827,#31569b);color:#fff;', '.hero{background:linear-gradient(135deg,#101827,#31569b);color:#fff;')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-hero-text.yml
          git commit -m 'fix: replace hero with text' || exit 0
          git rm .github/workflows/fix-hero-text.yml
          git add index.html
          git commit --amend --no-edit
          git push
