<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo Tài Khoản - ShopZiclCRBLX</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial;color:#172033}.page{width:min(820px,100%);margin:auto;padding:45px 24px}h1{text-align:center;font-size:52px;margin:0}.sub{text-align:center;color:#65738a;font-size:21px;font-weight:700;margin:14px 0 55px}.field{margin-bottom:25px}label{display:block;font-size:21px;font-weight:900;margin-bottom:10px}input{width:100%;height:66px;padding:0 18px;border:1px solid #cfd5dd;border-radius:14px;background:#f4f5f7;font-size:17px}button{width:100%;height:66px;border:0;border-radius:14px;background:#050505;color:#fff;font-size:19px;font-weight:900;cursor:pointer}.msg{text-align:center;font-weight:800;margin:15px}.back{display:block;text-align:center;margin-top:20px;color:#172033;font-weight:800}</style></head><body><main class="page"><h1>Tạo Tài Khoản</h1><div class="sub">Đăng ký tài khoản để tiếp tục trải nghiệm của bạn</div><form id="f"><div class="field"><label>Tên tài khoản</label><input id="n" required minlength="3" placeholder="Nhập tên tài khoản"></div><div class="field"><label>Email</label><input id="e" type="email" placeholder="Nhập email của bạn (không bắt buộc)"></div><div class="field"><label>Mật khẩu</label><input id="p" type="password" required minlength="6" placeholder="Nhập mật khẩu"></div><div class="field"><label>Xác nhận mật khẩu</label><input id="p2" type="password" required minlength="6" placeholder="Nhập lại mật khẩu"></div><div id="m" class="msg"></div><button>Đăng ký tài khoản</button></form><a class="back" href="index.html">← Quay lại trang chính</a></main><script>f.onsubmit=e=>{e.preventDefault();const u=JSON.parse(localStorage.getItem('users')||'[]');if(p.value!==p2.value){m.textContent='Mật khẩu không khớp';return}if(u.some(x=>x.name.toLowerCase()===n.value.trim().toLowerCase())){m.textContent='Tên tài khoản đã tồn tại';return}u.push({name:n.value.trim(),email:e.value,password:p.value,createdAt:new Date().toISOString()});localStorage.setItem('users',JSON.stringify(u));m.style.color='#098b58';m.textContent='Đăng ký thành công!';setTimeout(()=>location.href='index.html',700)}</script></body></html>
