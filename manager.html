<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopZiCiCRBLX — Manager</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1450px;margin:auto;padding:25px}.top{background:#172554;color:#fff;padding:18px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:5}.top h1{font-size:21px;margin:0}.top button{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.logout{background:#fff;color:#172554}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.stat,.panel{background:#fff;border:1px solid #e5e9f0;border-radius:17px;box-shadow:0 5px 20px #00000009}.stat{padding:20px}.stat b{display:block;font-size:27px;margin-top:8px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tabs button{border:0;background:#e9edf4;padding:12px 16px;border-radius:10px;font-weight:900;cursor:pointer}.tabs button.active{background:#172554;color:#fff}.panel{padding:22px;display:none}.panel.active{display:block}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}.table th{background:#f7f9fc}.btn{border:0;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer;margin:2px}.green{background:#dff7ea;color:#087443}.red{background:#ffe3e3;color:#b42318}.blue{background:#e5edff;color:#2855c5}.yellow{background:#fff1c7;color:#805b00}.login{max-width:430px;margin:100px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 45px #0002}.login input{width:100%;padding:14px;margin:8px 0;border:1px solid #d7dce5;border-radius:10px}.login button{width:100%;padding:14px;margin-top:10px;background:#172554;color:#fff;border:0;border-radius:10px;font-weight:900;cursor:pointer}.notice{padding:14px;border-radius:11px;background:#fff8e6;border:1px solid #ffe08a;color:#805b00}.secret{font-family:monospace;background:#f3f4f6;border-radius:6px;padding:3px 6px;word-break:break-all}.confirm-overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.confirm-overlay.show{display:flex}.confirm-box{width:min(460px,100%);background:#fff;border-radius:18px;padding:25px;box-shadow:0 20px 70px #0005}.confirm-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.confirm-actions button{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.cancel-confirm{background:#eef2f7}.danger-confirm{background:#b42318;color:#fff}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:12px}}</style>
</head><body>

<div id="root"></div>

<div id="cancelConfirm" class="confirm-overlay"><div class="confirm-box"><h2>⚠️ Xác nhận hủy đơn</h2><p id="cancelConfirmText">Bạn có chắc muốn hủy đơn này?</p><p class="notice">💰 Nếu đơn đã bị trừ tiền, hệ thống sẽ tự động hoàn lại đúng số tiền của đơn cho khách. Chỉ được hoàn một lần.</p><div class="confirm-actions"><button class="cancel-confirm" onclick="closeCancelConfirm()">Không, quay lại</button><button class="danger-confirm" onclick="confirmCancelOrder()">Xác nhận hủy + hoàn tiền</button></div></div></div>

<script>

let SUPABASE_URL='',SUPABASE_ANON_KEY='';let token=localStorage.getItem('shopzicl_access_token'),profile=null,pendingCancelId=null;

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function money(v){return Number(v||0).toLocaleString('vi-VN')+' đ'}

function backupCode(extra){if(!extra)return '';let x=extra;try{if(typeof x==='string')x=JSON.parse(x)}catch{}if(!x||typeof x!=='object')return '';for(const k of ['backup_code','backupCode','recovery_code','recoveryCode','backup','recovery','ma_du_phong','maDuPhong'])if(x[k]!=null&&String(x[k]).trim())return String(x[k]);return ''}

async function loadSupabaseConfig(){const r=await fetch('./index.html',{cache:'no-store'});const html=await r.text();function getConst(name){const marker='const '+name+'=';const i=html.indexOf(marker);if(i<0)return null;const start=i+marker.length;const q=html[start];const end=html.indexOf(q,start+1);return end<0?null:html.slice(start+1,end)}const url=getConst('SUPABASE_URL'),key=getConst('SUPABASE_KEY');if(!url||!key)throw Error('Không tìm thấy cấu hình Supabase trong trang chính.');SUPABASE_URL=url;SUPABASE_ANON_KEY=key;localStorage.setItem('shopzicl_supabase_url',url);localStorage.setItem('shopzicl_supabase_anon_key',key)}

async function api(path,options={}){const h={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+(token||SUPABASE_ANON_KEY),'Content-Type':'application/json',...(options.headers||{})};const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:h});const t=await r.text();if(!r.ok)throw Error(t||r.statusText);if(!t)return null;try{return JSON.parse(t)}catch{throw Error('Máy chủ trả về dữ liệu không hợp lệ.')}}async function rpc(fn,body){return api('rpc/'+fn,{method:'POST',body:JSON.stringify(body)})}

async function authUser(){if(!token)return null;const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+token}});if(!r.ok)return null;return r.json()}

async function init(){try{await loadSupabaseConfig();const u=await authUser();if(!u){showLogin();return}const rows=await api('profiles?select=id,username,email,role,balance,created_at&id=eq.'+encodeURIComponent(u.id));profile=rows?.[0];if(!profile||!['admin','manager'].includes(profile.role)){showDenied();return}render()}catch(e){showLogin(e.message)}}

function showLogin(msg=''){root.innerHTML='<div class="login"><h2>🛠️ ShopZiCiCRBLX — Manager</h2><p>'+esc(msg||'Đăng nhập tài khoản Manager của shop.')+'</p><input id="em" type="email" placeholder="Email Manager"><input id="pw" type="password" placeholder="Mật khẩu"><button onclick="login()">ĐĂNG NHẬP</button></div>'}

async function login(){try{await loadSupabaseConfig();const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em.value.trim(),password:pw.value})});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('Không kết nối được Supabase.')}if(!r.ok)throw Error(d.error_description||d.msg||'Đăng nhập thất bại');token=d.access_token;localStorage.setItem('shopzicl_access_token',token);init()}catch(e){alert(e.message)}}

function showDenied(){root.innerHTML='<div class="login"><h2>⛔ Không có quyền</h2><p>Tài khoản này chưa được cấp quyền Manager.</p><button onclick="logout()">ĐĂNG XUẤT</button></div>'}

function logout(){localStorage.removeItem('shopzicl_access_token');token=null;location.reload()}

function render(){root.innerHTML=`<header class="top"><h1>🛠️ ShopZiCiCRBLX — Manager</h1><div><span style="margin-right:12px">${esc(profile.username||profile.email)}</span><button class="logout" onclick="logout()">Đăng xuất</button></div></header><main class="wrap"><div class="stats"><div class="stat">👥 Khách hàng<b id="sUsers">...</b></div><div class="stat">📦 Đơn hàng<b id="sOrders">...</b></div><div class="stat">💳 Thẻ chờ duyệt<b id="sDeposits">...</b></div><div class="stat">💰 Tổng số dư<b id="sBalance">...</b></div></div><div class="tabs"><button class="active" onclick="tab('users',this)">👥 Khách hàng</button><button onclick="tab('deposits',this)">💳 Duyệt thẻ</button><button onclick="tab('orders',this)">📦 Đơn hàng</button><button onclick="tab('transactions',this)">💰 Lịch sử tiền</button></div><section id="users" class="panel active"></section><section id="deposits" class="panel"></section><section id="orders" class="panel"></section><section id="transactions" class="panel"></section></main>`;loadAll()}

function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}

async function loadAll(){
  try{
    const orderSelect=profile.role==='admin'
      ?'id,user_id,service_name,package_name,price,status,account,password,game_username,game_password,extra_data,created_at,updated_at'
      :'id,user_id,service_name,package_name,price,status,account,game_username,extra_data,created_at,updated_at';

    const [users,deposits,orders,tx]=await Promise.all([
      api('profiles?select=id,username,email,role,balance,created_at&order=created_at.desc'),
      api('deposits?select=id,user_id,card_type,amount,serial,card_code,status,rejection_reason,created_at&order=created_at.desc'),
      api('orders?select='+orderSelect+'&order=created_at.desc'),
      api('balance_transactions?select=id,user_id,amount,balance_after,type,note,created_at&order=created_at.desc')
    ]);

    const map=Object.fromEntries(users.map(u=>[u.id,u]));
    sUsers.textContent=users.filter(u=>u.role==='customer').length;
    sOrders.textContent=orders.length;
    sDeposits.textContent=deposits.filter(d=>d.status==='pending').length;
    sBalance.textContent=money(users.reduce((a,u)=>a+Number(u.balance||0),0));
    renderUsers(users);
    renderDeposits(deposits,map);
    renderOrders(orders,map);
    renderTx(tx,map)
  }catch(e){alert(e.message)}
}

function renderUsers(users){document.getElementById('users').innerHTML='<h2>👥 Quản lý khách hàng</h2><div class="table-wrap"><table class="table"><tr><th>Tài khoản</th><th>Email</th><th>Vai trò</th><th>Số dư</th><th>Thao tác</th></tr>'+users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><b>${money(u.balance)}</b></td><td>${u.role==='customer'?`<button class="btn green" onclick="adjust('${u.id}',1)">➕ Cộng</button><button class="btn red" onclick="adjust('${u.id}',-1)">➖ Trừ</button><button class="btn blue" onclick="setBalance('${u.id}')">💰 Đặt số dư</button>`:'Không chỉnh'}</td></tr>`).join('')+'</table></div>'}

function renderDeposits(ds,map){document.getElementById('deposits').innerHTML='<h2>💳 Duyệt thẻ cào</h2><div class="notice">🔓 Manager được xem đầy đủ Seri và mã thẻ.</div><div class="table-wrap"><table class="table"><tr><th>Khách</th><th>Nhà mạng</th><th>Mệnh giá</th><th>Seri</th><th>Mã thẻ</th><th>Trạng thái</th><th>Thao tác</th></tr>'+ds.map(d=>`<tr><td>${esc(map[d.user_id]?.username||d.user_id)}</td><td>${esc(d.card_type)}</td><td>${money(d.amount)}</td><td><span class="secret">${esc(d.serial||'Chưa có')}</span></td><td><span class="secret">${esc(d.card_code||'Chưa có')}</span></td><td>${esc(d.status)}</td><td>${d.status==='pending'?`<button class="btn green" onclick="reviewDeposit('${d.id}',true)">✅ Duyệt + cộng tiền</button><button class="btn red" onclick="reviewDeposit('${d.id}',false)">❌ Từ chối</button>`:'Đã xử lý'}</td></tr>`).join('')+'</table></div>'}

function renderOrders(os,map){
  document.getElementById('orders').innerHTML='<h2>📦 Quản lý đơn hàng</h2><div class="table-wrap"><table class="table"><tr><th>Khách</th><th>Thông tin tài khoản</th><th>Dịch vụ</th><th>Gói</th><th>Giá</th><th>Trạng thái</th><th>Thao tác</th></tr>'+os.map(o=>{
    const rid=o.game_username||o.account||'';
    const rpw=profile.role==='manager'?'****':(o.game_password||o.password||'');
    const b=backupCode(o.extra_data);
    return `<tr><td>${esc(map[o.user_id]?.username||o.user_id)}</td><td><div>🎮 <b>ID Roblox:</b> <span class="secret">${esc(rid||'Chưa có')}</span></div><div>🔑 <b>Mật khẩu:</b> <span class="secret">${esc(rpw||'Chưa có')}</span></div><div>🛡️ <b>Mã dự phòng:</b> <span class="secret">${esc(b||'Chưa có')}</span></div></td><td>${esc(o.service_name)}</td><td>${esc(o.package_name)}</td><td>${money(o.price)}</td><td>${esc(o.status)}</td><td><button class="btn yellow" onclick="orderStatus('${o.id}','pending')">Chờ</button><button class="btn blue" onclick="orderStatus('${o.id}','working')">Đang làm</button><button class="btn green" onclick="orderStatus('${o.id}','completed')">Hoàn thành</button>${o.status!=='cancelled'?`<button class="btn red" onclick="openCancelConfirm('${o.id}','${esc(map[o.user_id]?.username||'Khách')} — ${esc(o.package_name)} — ${money(o.price)}')">❌ Hủy</button>`:'<span style="color:#087443;font-weight:800">Đã hủy + hoàn tiền</span>'}</td></tr>`
  }).join('')+'</table></div>'
}

function renderTx(ts,map){document.getElementById('transactions').innerHTML='<h2>💰 Lịch sử biến động số dư</h2><div class="table-wrap"><table class="table"><tr><th>Khách</th><th>Biến động</th><th>Số dư sau</th><th>Loại</th><th>Ghi chú</th><th>Thời gian</th></tr>'+ts.map(t=>`<tr><td>${esc(map[t.user_id]?.username||t.user_id)}</td><td style="color:${Number(t.amount)>=0?'#087443':'#b42318'}"><b>${Number(t.amount)>=0?'+':''}${money(t.amount)}</b></td><td>${money(t.balance_after)}</td><td>${esc(t.type)}</td><td>${esc(t.note)}</td><td>${new Date(t.created_at).toLocaleString('vi-VN')}</td></tr>`).join('')+'</table></div>'}

function openCancelConfirm(id,label){pendingCancelId=id;document.getElementById('cancelConfirmText').textContent='Bạn có chắc muốn hủy đơn: '+label+'?';document.getElementById('cancelConfirm').classList.add('show')}

function closeCancelConfirm(){pendingCancelId=null;document.getElementById('cancelConfirm').classList.remove('show')}

async function confirmCancelOrder(){if(!pendingCancelId)return;const id=pendingCancelId;try{await rpc('admin_set_order_status',{p_order_id:id,p_status:'cancelled'});closeCancelConfirm();await loadAll();alert('✅ Đã hủy đơn và hoàn tiền cho khách (nếu đơn đã được trừ tiền).')}catch(e){alert('Không thể hủy đơn: '+e.message)}}

async function adjust(id,sign){const raw=prompt('Nhập số tiền '+(sign>0?'cộng':'trừ')+':');const n=Number(raw);if(!Number.isInteger(n)||n<=0)return alert('Số tiền không hợp lệ');try{await rpc('admin_adjust_balance',{p_user_id:id,p_amount:n*sign,p_note:'Manager điều chỉnh số dư'});loadAll()}catch(e){alert(e.message)}}

async function setBalance(id){const users=await api('profiles?select=balance&id=eq.'+id),current=Number(users[0]?.balance||0),target=Number(prompt('Nhập số dư mới:',current));if(!Number.isInteger(target)||target<0)return alert('Số dư không hợp lệ');try{await rpc('admin_adjust_balance',{p_user_id:id,p_amount:target-current,p_note:'Manager đặt lại số dư'});loadAll()}catch(e){alert(e.message)}}

async function reviewDeposit(id,approve){let reason=null;if(!approve)reason=prompt('Lý do từ chối:')||'Thẻ không hợp lệ';if(!confirm(approve?'Duyệt thẻ và cộng tiền cho khách?':'Từ chối thẻ này?'))return;try{await rpc('admin_review_deposit',{p_deposit_id:id,p_approve:approve,p_reason:reason});loadAll()}catch(e){alert(e.message)}}

async function orderStatus(id,status){try{await rpc('admin_set_order_status',{p_order_id:id,p_status:status});loadAll()}catch(e){alert(e.message)}}

init();

</script></body>
</html>
