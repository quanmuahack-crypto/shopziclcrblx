<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch sử nạp · ShopZiCiCRBLX</title>
<script>try{if(localStorage.getItem('shop_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050c;--bg2:#110c1b;--panel:#120d1c;--line:#2a1f40;--line2:#3b2b5c;--cyan:#8b5cf6;--cyan-2:#c4b5fd;--text:#f3eefc;--muted:#a99ec4;--display:'Chakra Petch','Be Vietnam Pro',system-ui,sans-serif;--body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
html[data-theme="light"]{--bg:#f7f5fb;--bg2:#f4f1f9;--panel:#ffffff;--line:#ebe6f3;--line2:#ddd5ea;--cyan:#7c3aed;--cyan-2:#6d28d9;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100vh;font-family:var(--body);color:var(--text);background-color:var(--bg);background-image:repeating-linear-gradient(135deg,rgba(139,92,246,.075) 0 2px,transparent 2px 24px),radial-gradient(70% 45% at 50% -5%,rgba(124,58,237,.28),transparent 70%);background-attachment:fixed}
html[data-theme="light"] body{background-image:repeating-linear-gradient(135deg,rgba(139,92,246,.05) 0 2px,transparent 2px 24px),radial-gradient(70% 45% at 50% -5%,rgba(167,139,250,.25),transparent 70%)}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.logo i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 0 20px -6px #8b5cf6}
.logo b{font-family:var(--display);font-size:20px;letter-spacing:.5px;color:var(--cyan-2)}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel);color:var(--text);text-decoration:none}
.ib:hover,.back:hover{border-color:var(--cyan)}
.back{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
.head{display:flex;align-items:center;gap:16px;margin:0 0 22px}
.tile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;box-shadow:0 10px 26px -10px #ef4444;flex:none}
.head h1{margin:0;font-family:var(--display);font-size:30px;letter-spacing:.5px;text-transform:uppercase;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.head p b{color:var(--cyan-2)}
.zc-btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border-radius:12px;background:var(--cyan);color:#fff;font-weight:700;text-decoration:none}
.skel{height:76px;border-radius:16px;background:linear-gradient(90deg,var(--panel),var(--bg2),var(--panel));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile svg{width:26px;height:26px}
.lsn-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;padding:28px;border-radius:22px;background:radial-gradient(120% 140% at 0% 0%,rgba(139,92,246,.35),transparent 55%),linear-gradient(135deg,#1c1033,#120d1c 60%);border:1px solid rgba(139,92,246,.45);box-shadow:0 0 50px -20px rgba(124,58,237,.7);margin:0 0 18px}
.lsn-hero:after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);pointer-events:none}
.lsn-k{margin:0 0 6px;color:#c4b5fd;font-size:13.5px;font-weight:700;letter-spacing:.3px}
.lsn-big{margin:0;font-family:var(--display);font-size:46px;line-height:1.05;color:#fff;letter-spacing:.5px;text-shadow:0 0 30px rgba(167,139,250,.55)}
.lsn-big small{font-size:22px;color:#c4b5fd;margin-left:4px}
.lsn-rate{margin:18px 0 0}
.lsn-rate-top{display:flex;justify-content:space-between;font-size:13px;color:#d6cdea;margin:0 0 7px}
.lsn-rate-top b{color:#fff}
.lsn-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;display:flex}
.lsn-bar i{display:block;height:100%}
.lsn-bar .ok{background:linear-gradient(90deg,#22c55e,#4ade80)}
.lsn-bar .wait{background:#a78bfa}
.lsn-bar .bad{background:#f87171}
.lsn-mini{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-self:center}
.lsn-mini div{padding:14px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-align:center}
.lsn-mini b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;color:#fff}
.lsn-mini span{display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:#d6cdea}
.lsn-mini .ok b{color:#4ade80}.lsn-mini .wait b{color:#c4b5fd}.lsn-mini .bad b{color:#f87171}
.lsn-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.lsn-seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line2)}
.lsn-seg button{height:36px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap}
.lsn-seg button em{font-style:normal;margin-left:6px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08);font-size:11.5px}
html[data-theme="light"] .lsn-seg button em{background:#ede9f6}
html[data-theme="light"] .lsn-seg button.on em{background:rgba(255,255,255,.25)}
.lsn-seg button.on{background:var(--cyan);color:#fff}
.lsn-seg button.on em{background:rgba(255,255,255,.2)}
.lsn-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);color:var(--muted)}
.lsn-search:focus-within{border-color:var(--cyan)}
.lsn-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:14.5px}
.lsn-day{margin:18px 2px 8px;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.lsn-list{display:flex;flex-direction:column;gap:8px}
.lsn-row{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s}
.lsn-row:hover{border-color:var(--line2)}
.lsn-tel{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:15px;letter-spacing:.3px;background:var(--c);box-shadow:0 8px 18px -10px var(--c)}
.lsn-t b{display:block;font-size:15.5px;color:var(--text)}
.lsn-t span{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.lsn-t span code{font-family:Consolas,Menlo,monospace;font-size:12.5px}
.lsn-why{grid-column:2/-1;margin-top:-4px;padding:8px 11px;border-radius:10px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.28);color:#fca5a5;font-size:13px;line-height:1.5}
.lsn-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lsn-amt{font-family:var(--display);font-size:19px;white-space:nowrap}
.lsn-amt.ok{color:#4ade80}.lsn-amt.bad{color:var(--muted);text-decoration:line-through}.lsn-amt.wait{color:var(--text)}
.lsn-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.lsn-pill.ok{background:rgba(34,197,94,.14);color:#4ade80}
.lsn-pill.bad{background:rgba(248,113,113,.14);color:#f87171}
.lsn-pill.wait{background:rgba(139,92,246,.16);color:#c4b5fd}
.lsn-pill.wait:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;animation:lsnPulse 1.2s ease-in-out infinite}
@keyframes lsnPulse{50%{opacity:.25}}
.lsn-real{font-size:12px;color:var(--muted)}
.lsn-real b{color:#4ade80}
.lsn-more{display:block;margin:16px auto 0;height:42px;padding:0 22px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-weight:700}
.lsn-more:hover{border-color:var(--cyan);color:var(--cyan-2)}
.lsn-empty{padding:50px 20px;text-align:center;border-radius:18px;background:var(--panel);border:1px dashed var(--line2);color:var(--muted)}
.lsn-empty b{display:block;margin:0 0 6px;color:var(--text);font-size:17px}
.lsn-empty .zc-btn{margin-top:16px}
html[data-theme="light"] .lsn-hero{background:radial-gradient(120% 140% at 0% 0%,rgba(167,139,250,.35),transparent 55%),linear-gradient(135deg,#f5f0ff,#ffffff 60%);border-color:rgba(139,92,246,.35);box-shadow:0 14px 40px -24px rgba(124,58,237,.5)}
html[data-theme="light"] .lsn-k{color:#7c3aed}
html[data-theme="light"] .lsn-big{color:#1e1033;text-shadow:none}
html[data-theme="light"] .lsn-big small{color:#7c3aed}
html[data-theme="light"] .lsn-rate-top{color:#475569}
html[data-theme="light"] .lsn-rate-top b{color:#0f172a}
html[data-theme="light"] .lsn-bar{background:#ede9f6}
html[data-theme="light"] .lsn-mini div{background:#fff;border-color:#e9e3f3}
html[data-theme="light"] .lsn-mini b{color:#0f172a}
html[data-theme="light"] .lsn-mini span{color:#64748b}
html[data-theme="light"] .lsn-mini .ok b,html[data-theme="light"] .lsn-amt.ok,html[data-theme="light"] .lsn-pill.ok,html[data-theme="light"] .lsn-real b{color:#16a34a}
html[data-theme="light"] .lsn-mini .wait b,html[data-theme="light"] .lsn-pill.wait{color:#7c3aed}
html[data-theme="light"] .lsn-mini .bad b,html[data-theme="light"] .lsn-pill.bad{color:#dc2626}
html[data-theme="light"] .lsn-why{color:#b91c1c}
@media(max-width:760px){.lsn-hero{grid-template-columns:1fr;padding:22px}.lsn-big{font-size:36px}.lsn-seg{width:100%;overflow-x:auto}.lsn-search{min-width:0;width:100%}}
@media(max-width:520px){.lsn-row{grid-template-columns:40px 1fr;gap:12px;padding:12px}.lsn-tel{width:40px;height:40px;font-size:13px}.lsn-r{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}.lsn-why{grid-column:1/-1;margin-top:0}.lsn-mini b{font-size:21px}.lsn-seg{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}.lsn-seg button{padding:0 4px;font-size:12px;height:auto;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}.lsn-seg button em{margin:0}}
@media(prefers-reduced-motion:reduce){.lsn-pill.wait:before{animation:none}}
@media(max-width:520px){.logo b{display:none}.head h1{font-size:24px}.tile{width:48px;height:48px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="index.html" title="ShopZiCiCRBLX"><i><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg></i><b>SHOPZICICRBLX</b></a><button class="ib" id="thBtn" type="button" aria-label="Đổi giao diện"></button><a class="back" href="index.html" title="Về shop"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Về shop</a></div></header>
<main class="wrap">
<div class="head"><span class="tile"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v2"/><path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M16 12h5v4h-5a2 2 0 0 1 0-4z"/></svg></span><div><h1>Lịch sử nạp</h1><p id="who">Tất cả thẻ cào bạn đã nạp vào shop và kết quả xử lý.</p></div></div>
<div id="lsnBox"><div class="skel" style="height:170px;margin-bottom:16px"></div><div class="skel"></div><div class="skel"></div></div>
<p class="foot">Chỉ bạn mới xem được lịch sử nạp của tài khoản này.</p>
</main>
<script>
const SUPABASE_URL='https://ufevipuhejvhiufyqqnz.supabase.co';
const SUPABASE_KEY='sb_publishable_6ShPhvGpN4_02Za2tOTOTg_GF0su_OA';
const token=(()=>{try{return localStorage.getItem('shopzicl_username_token')||''}catch(e){return ''}})();
const TEL={viettel:['VT','#e11d48'],mobifone:['MB','#2563eb'],vinaphone:['VN','#0ea5e9'],vietnamobile:['VM','#f97316'],zing:['ZG','#16a34a'],garena:['GR','#ea580c'],vcoin:['VC','#ca8a04'],scoin:['SC','#0d9488'],gate:['GT','#7c3aed']};
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SEARCH='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
const el=document.getElementById('lsnBox');
let rows=[],filter='all',q='',shown=20,uid='';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const vnd=n=>Number(n||0).toLocaleString('vi-VN');
const kind=s=>{s=String(s||'').toLowerCase();return s==='approved'?'ok':s==='rejected'?'bad':'wait'};
function thPaint(){document.getElementById('thBtn').innerHTML=document.documentElement.getAttribute('data-theme')==='light'?SUN:MOON}
document.getElementById('thBtn').onclick=()=>{const l=document.documentElement.getAttribute('data-theme')!=='light';if(l)document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('shop_theme',l?'light':'dark')}catch(e){}thPaint()};
thPaint();
async function api(path){const r=await fetch(SUPABASE_URL+path,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){throw Error('Máy chủ trả về dữ liệu không hợp lệ. Vui lòng tải lại trang.')}if(!r.ok){const e=Error(d&&(d.message||d.error_description||d.msg)||'Không thể tải dữ liệu');e.status=r.status;throw e}return d}
async function load(){const base='/rest/v1/deposits?select=id,card_type,amount,serial,status,rejection_reason,created_at';const tail='&user_id=eq.'+encodeURIComponent(uid)+'&order=created_at.desc&limit=500';try{return await api(base+',api_credit'+tail)}catch(e){if(/api_credit|column|42703/i.test(String(e.message)))return api(base+tail);throw e}}
function dayLabel(d){const x=new Date(d),t=new Date();const a=new Date(x.getFullYear(),x.getMonth(),x.getDate()),b=new Date(t.getFullYear(),t.getMonth(),t.getDate());const diff=Math.round((b-a)/864e5);if(diff===0)return 'Hôm nay';if(diff===1)return 'Hôm qua';return x.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function hero(){const ok=rows.filter(r=>kind(r.status)==='ok'),w=rows.filter(r=>kind(r.status)==='wait'),b=rows.filter(r=>kind(r.status)==='bad');const sum=ok.reduce((a,r)=>a+Number(r.api_credit||r.amount||0),0);const n=rows.length||1;const rate=rows.length?Math.round(ok.length*100/rows.length):0;
 return '<section class="lsn-hero"><div style="position:relative;z-index:1"><p class="lsn-k">Tổng tiền nạp thành công</p><p class="lsn-big">'+vnd(sum)+'<small>đ</small></p><div class="lsn-rate"><div class="lsn-rate-top"><span>Tỉ lệ thẻ thành công</span><b>'+rate+'%</b></div><div class="lsn-bar"><i class="ok" style="width:'+(ok.length*100/n)+'%"></i><i class="wait" style="width:'+(w.length*100/n)+'%"></i><i class="bad" style="width:'+(b.length*100/n)+'%"></i></div></div></div><div class="lsn-mini"><div class="ok"><b>'+ok.length+'</b><span>Thành công</span></div><div class="wait"><b>'+w.length+'</b><span>Đang xử lý</span></div><div class="bad"><b>'+b.length+'</b><span>Thất bại</span></div></div></section>'}
function tools(){const c=k=>k==='all'?rows.length:rows.filter(r=>kind(r.status)===k).length;const btn=(k,l)=>'<button type="button" data-f="'+k+'" class="'+(filter===k?'on':'')+'">'+l+'<em>'+c(k)+'</em></button>';return '<div class="lsn-tools"><div class="lsn-seg">'+btn('all','Tất cả')+btn('ok','Thành công')+btn('wait','Đang xử lý')+btn('bad','Thất bại')+'</div><label class="lsn-search">'+SEARCH+'<input id="lsnQ" placeholder="Tìm theo số serial hoặc loại thẻ" value="'+esc(q)+'"></label></div>'}
function row(r){const k=kind(r.status);const t=TEL[String(r.card_type||'').toLowerCase()]||[String(r.card_type||'?').slice(0,2).toUpperCase(),'#7c3aed'];const ser=String(r.serial||'');const masked=ser.length>4?'••••'+ser.slice(-4):ser;const time=new Date(r.created_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
 const pill=k==='ok'?'<span class="lsn-pill ok">✓ Thành công</span>':k==='bad'?'<span class="lsn-pill bad">✕ Thất bại</span>':'<span class="lsn-pill wait">Đang xử lý</span>';
 const amt='<span class="lsn-amt '+k+'">'+(k==='ok'?'+':'')+vnd(r.amount)+'đ</span>';
 const real=k==='ok'&&r.api_credit&&Number(r.api_credit)!==Number(r.amount)?'<span class="lsn-real">Thực nhận <b>'+vnd(r.api_credit)+'đ</b></span>':'';
 return '<div class="lsn-row"><span class="lsn-tel" style="--c:'+t[1]+'">'+esc(t[0])+'</span><div class="lsn-t"><b>Thẻ '+esc(r.card_type)+' '+vnd(r.amount)+'đ</b><span>'+(masked?'Seri <code>'+esc(masked)+'</code> · ':'')+time+'</span></div><div class="lsn-r">'+amt+pill+real+'</div>'+(k==='bad'?'<div class="lsn-why">'+esc(r.rejection_reason||'Thẻ bị từ chối')+'</div>':'')+'</div>'}
function list(){const qq=q.trim().toLowerCase();let L=rows.filter(r=>(filter==='all'||kind(r.status)===filter)&&(!qq||String(r.serial||'').toLowerCase().includes(qq)||String(r.card_type||'').toLowerCase().includes(qq)));if(!L.length)return '<div class="lsn-empty"><b>Không có thẻ nào khớp</b>Thử bộ lọc khác hoặc xoá ô tìm kiếm.</div>';const total=L.length;L=L.slice(0,shown);let out='',last='';L.forEach(r=>{const d=dayLabel(r.created_at);if(d!==last){if(last)out+='</div>';out+='<p class="lsn-day">'+esc(d)+'</p><div class="lsn-list">';last=d}out+=row(r)});out+='</div>';if(total>shown)out+='<button type="button" class="lsn-more" id="lsnMore">Xem thêm '+Math.min(20,total-shown)+' thẻ</button>';return out}
function paint(){if(!rows.length){el.innerHTML='<div class="lsn-empty"><b>Bạn chưa nạp thẻ nào</b>Nạp thẻ cào để có số dư mua dịch vụ trong shop.<br><a class="zc-btn" href="index.html#nap-the" title="Nạp thẻ cào">Nạp thẻ ngay</a></div>';return}el.innerHTML=hero()+tools()+'<div id="lsnList">'+list()+'</div>';bind()}
function paintList(){document.getElementById('lsnList').innerHTML=list();document.querySelectorAll('.lsn-seg button').forEach(b=>b.classList.toggle('on',b.dataset.f===filter));bindMore()}
function bindMore(){const m=document.getElementById('lsnMore');if(m)m.onclick=()=>{shown+=20;paintList()}}
function bind(){el.querySelectorAll('.lsn-seg button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;shown=20;paintList()});const i=document.getElementById('lsnQ');i.oninput=()=>{q=i.value;shown=20;paintList()};bindMore()}
function needLogin(msg){el.innerHTML='<div class="lsn-empty"><b>Cần đăng nhập</b>'+esc(msg)+'<br><a class="zc-btn" href="index.html" title="Đăng nhập tại shop">Đăng nhập tại shop</a></div>'}
async function refresh(first){try{const r=await load();if(!first&&JSON.stringify(r)===JSON.stringify(rows))return;rows=r||[];if(first||!document.getElementById('lsnList'))paint();else{el.querySelector('.lsn-hero').outerHTML=hero();el.querySelector('.lsn-tools').outerHTML=tools();bind();paintList()}}catch(e){if(first)el.innerHTML='<div class="lsn-empty"><b>Không tải được lịch sử nạp</b>'+esc(e.message)+'</div>'}}
async function init(){if(!token){needLogin('Bạn cần đăng nhập tài khoản shop để xem lịch sử nạp.');return}try{const u=await api('/auth/v1/user');uid=u.id;const name=(u.user_metadata&&u.user_metadata.username)||'';if(name)document.getElementById('who').innerHTML='Tài khoản <b>'+esc(name)+'</b> · tất cả thẻ cào đã nạp và kết quả xử lý.'}catch(e){needLogin(e.status===401||e.status===403?'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại tại shop.':e.message);return}await refresh(true);setInterval(()=>{if(!document.hidden&&rows.some(r=>kind(r.status)==='wait'))refresh(false)},10000)}
init();
</script>
</body>
</html>
