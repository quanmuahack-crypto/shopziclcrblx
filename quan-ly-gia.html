<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopZiCiCRBLX — Quản lý giá</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#172033}.top{background:#172554;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{font-size:22px;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px 16px}.login,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 30px #00000010}.login{max-width:430px;margin:80px auto;padding:28px}.login input,.price-input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172554;color:#fff}.light{background:#e5e7eb;color:#172033}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}.search{padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;min-width:min(100%,320px)}.group{margin-bottom:22px}.group h2{margin:0 0 10px;font-size:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:13px;border-bottom:1px solid #edf0f4;text-align:left}.table th{background:#f8fafc}.status{padding:10px 14px;border-radius:10px;margin:10px 0;display:none}.status.ok{display:block;background:#dcfce7;color:#166534}.status.err{display:block;background:#fee2e2;color:#b91c1c}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:14px}.top{padding:14px}.table{min-width:620px}}
</style>
</head>
<body>
<header class="top"><h1>💰 ShopZiCiCRBLX — Quản lý giá dịch vụ</h1><div id="topUser"></div></header>
<main class="wrap">
<div id="loginBox" class="login">
<h2>Đăng nhập quản lý</h2>
<p>Đăng nhập bằng email Supabase của Admin/Manager.</p>
<input id="email" type="email" placeholder="Email Admin / Manager" autocomplete="username">
<div style="height:10px"></div>
<input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
<div id="loginMsg" class="status"></div>
<button class="btn primary" style="width:100%;margin-top:14px" onclick="login()">ĐĂNG NHẬP</button>
</div>
<div id="app" class="hidden">
<div class="toolbar"><div><b id="count">0</b> gói dịch vụ</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="search" class="search" placeholder="Tìm dịch vụ..." oninput="renderPrices()"><button class="btn primary" onclick="saveAll()">💾 Lưu tất cả thay đổi</button><button class="btn light" onclick="loadPrices()">↻ Tải lại</button></div></div>
<div id="saveMsg" class="status"></div><div id="priceList"></div>
</div>
</main>
<script>
const SUPABASE_URL='https://ufevipuhejvhiufyqqnz.supabase.co';
const SUPABASE_KEY='sb_publishable_6ShPhvGpN4_02Za2tOTOTg_GF0su_OA';
let accessToken=localStorage.getItem('shopzicl_price_admin_token')||'';
let currentUser=null,prices=[];
const DEFAULT_CATALOG={'Leviathan':[['Đi nhanh 10 Tìm Leviathan - 99 Vảy',159000],['Lấy Huyết Quỷ Thuật A-Z',48000],['Kéo Leviathan về Hydra',21000],['Kéo Leviathan về Tiki',18000]],'Level':[['Level 1-700',30000],['Level 700-Sea 3',50000],['Sea 3-Max Level Bao God Human',30000]],'Combo Tộc V4':[['Combo 3 Tộc V4 Full Gear',110000],['Combo 4 Tộc V4 Full Gear',145000],['Combo 5 Tộc V4 Full Gear',180000],['Combo 6 Tộc V4 Full Gear',215000],['Lấy tộc Quỷ (bao V2-V3)',15000],['Lấy tộc Cyborg (bao V2-V3)',20000],['Pull Lever',10000]],'Tộc Draco':[['Lấy Tộc Rồng A-Z Full Gear',150000]],'Kiếm / Súng / Phụ kiện':[['Lấy CDK A-Z',50000],['Lấy Tam Kiếm A-Z',31000],['Lấy Skull Guitar A-Z',20000],['Lấy Lưỡi Hái Bóng Tối',15000],['Lấy Tushita',15000],['Lấy Yama',20000],['Lấy Mini Yoru',110000],['Lấy Mỏ Neo Cá Mập',40000],['Lấy Fox Lamp',30000]],'Beli & Frag':[['50M Beli',42000],['500M Beli',156000],['1 Tỷ Beli',240000],['15.000 Fragment',10000]],'Chromatic Box':[['1 Box',21000],['3 Box',75000],['10 Box',200000]]};
function mergeCatalog(rows){const map=new Map((rows||[]).map(x=>[x.service_name+'|||'+x.package_name,x]));let sort=0;for(const [service,items] of Object.entries(DEFAULT_CATALOG))items.forEach(([pkg,price])=>{const key=service+'|||'+pkg;if(!map.has(key))map.set(key,{id:null,service_name:service,package_name:pkg,price,sort_order:sort++,is_new:true})});return [...map.values()]}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return Number(n||0).toLocaleString('vi-VN')+' đ'}
function show(id,msg,type){const e=document.getElementById(id);e.textContent=msg;e.className='status '+type}
async function supa(path,opt={}){const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={}}if(!r.ok)throw Error(d.message||d.error_description||d.error||t||r.statusText);return d}
async function login(){
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password)return show('loginMsg','Vui lòng nhập email và mật khẩu.','err');
 try{
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.access_token)throw Error(d.error_description||d.msg||'Email hoặc mật khẩu không đúng.');
  accessToken=d.access_token;localStorage.setItem('shopzicl_price_admin_token',accessToken);await boot();
 }catch(e){show('loginMsg',e.message,'err')}
}
async function boot(){
 try{
  currentUser=await supa('/auth/v1/user');
  const rows=await supa('/rest/v1/profiles?select=id,username,email,role&id=eq.'+encodeURIComponent(currentUser.id));
  const profile=rows&&rows[0];
  if(!profile||!['admin','manager'].includes(profile.role))throw Error('Tài khoản này không có quyền quản lý giá.');
  currentUser={...currentUser,...profile};
  document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('topUser').innerHTML='<b>'+esc(profile.username||profile.email)+'</b> <button class="btn light" onclick="logout()">Đăng xuất</button>';
  await loadPrices();
 }catch(e){accessToken='';currentUser=null;localStorage.removeItem('shopzicl_price_admin_token');document.getElementById('loginBox').classList.remove('hidden');document.getElementById('app').classList.add('hidden');show('loginMsg',e.message,'err')}
}
async function loadPrices(){
 try{const rows=await supa('/rest/v1/service_prices?select=*&order=service_name.asc,sort_order.asc');prices=mergeCatalog(rows);document.getElementById('count').textContent=prices.length;renderPrices();}
 catch(e){show('saveMsg',e.message,'err')}
}
function renderPrices(){
 const q=document.getElementById('search').value.trim().toLowerCase();const filtered=prices.filter(x=>(x.service_name+' '+x.package_name).toLowerCase().includes(q));const groups={};filtered.forEach(x=>(groups[x.service_name]??=[]).push(x));
 document.getElementById('priceList').innerHTML=Object.keys(groups).map(service=>`<section class="group panel"><h2>${esc(service)}</h2><div class="table-wrap"><table class="table"><tr><th>Gói dịch vụ</th><th>Giá hiện tại</th><th>Giá mới</th></tr>${groups[service].map(x=>`<tr><td><b>${esc(x.package_name)}</b></td><td>${money(x.price)}</td><td><input class="price-input" type="number" min="0" step="1000" value="${Number(x.price)}" data-id="${x.id??''}" data-service="${esc(x.service_name)}" data-package="${esc(x.package_name)}" data-new="${x.id==null?'1':'0'}"></td></tr>`).join('')}</table></div></section>`).join('')||'<div class="panel" style="padding:20px">Không tìm thấy dịch vụ.</div>';
}
async function saveAll(){
 const changes=[...document.querySelectorAll('.price-input')].map(i=>({id:i.dataset.id||null,service_name:i.dataset.service,package_name:i.dataset.package,is_new:i.dataset.new==='1',price:Number(i.value)})).filter(x=>Number.isFinite(x.price)&&x.price>=0).filter(x=>x.is_new||prices.find(p=>String(p.id)===String(x.id))?.price!==x.price);
 if(!changes.length)return show('saveMsg','Không có thay đổi nào để lưu.','ok');
 try{for(const c of changes){if(c.is_new){await supa('/rest/v1/service_prices',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({service_name:c.service_name,package_name:c.package_name,price:Math.round(c.price),sort_order:0,updated_at:new Date().toISOString()})})}else{await supa('/rest/v1/service_prices?id=eq.'+encodeURIComponent(c.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({price:Math.round(c.price),updated_at:new Date().toISOString()})})}}show('saveMsg','✅ Đã lưu '+changes.length+' thay đổi vào Supabase.','ok');await loadPrices()}catch(e){show('saveMsg','❌ '+e.message,'err')}
}
function logout(){accessToken='';currentUser=null;localStorage.removeItem('shopzicl_price_admin_token');location.reload()}
boot();
</script>
</body>
</html>
